<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14261a">
<title>橡皮艇漂流</title>
<style>
  html, body { margin: 0; height: 100%; background: #14261a; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center;
         font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
         -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: relative; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  canvas { display: block; }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
             background: rgba(8, 28, 36, .5); color: #fff; text-align: center; }
  #overlay.hidden { display: none; }
  #panel { width: 80%; max-width: 340px; padding: 22px 20px 20px; border-radius: 18px;
           background: rgba(14, 44, 58, .93); border: 1.5px solid rgba(255,255,255,.22);
           animation: rise .3s ease-out; }
  @keyframes rise { from { transform: translateY(18px) scale(.96); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0) rotate(-40deg); } 70% { transform: scale(1.35) rotate(8deg); } 100% { transform: none; } }
  #panel h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: 2px; }
  #panel h2 { margin: 0 0 12px; font-size: 15px; font-weight: 500; color: #9fd0dc; }
  #panel p { margin: 6px 0; font-size: 14px; line-height: 1.6; color: #e2f1f4; }
  #panel .stars { font-size: 46px; letter-spacing: 6px; margin: 2px 0 6px; }
  #panel .stars span { display: inline-block; }
  #panel .stars .on { color: #ffd23f; text-shadow: 0 2px 0 #b8860b; animation: pop .45s backwards; animation-delay: calc(var(--i) * .32s + .25s); }
  #panel .stars .off { color: rgba(255,255,255,.2); }
  #panel .score { font-size: 34px; font-weight: 800; color: #ffe066; margin: 0; line-height: 1.2; }
  #panel .stats { display: flex; justify-content: space-around; margin: 8px 0 6px; }
  #panel .stats div { font-size: 12px; color: #9fd0dc; }
  #panel .stats b { display: block; font-size: 19px; color: #fff; }
  #panel .goals { text-align: left; display: inline-block; font-size: 13px; line-height: 1.75; color: #cfe6ea; }
  #panel .goals .ok { color: #8ce99a; } #panel .goals .no { color: #ffa8a8; }
  #panel kbd { display: inline-block; min-width: 20px; padding: 1px 6px; border-radius: 5px;
               background: #fff; color: #134; font: 600 13px/1.5 inherit; }
  #panel .small { font-size: 12px; color: #9fd0dc; }
  #panel .new { color: #ffe066; font-weight: 700; }
  button { margin-top: 14px; padding: 12px 34px; font: 600 18px/1 inherit; color: #5a2d00; cursor: pointer;
           background: linear-gradient(#ffd23f, #ff9f1c); border: 0; border-radius: 999px;
           box-shadow: 0 4px 0 #b8600b; }
  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; }
  .btns #go { flex-basis: 100%; margin-left: 12%; margin-right: 12%; }
  button.alt { padding: 9px 18px; font-size: 14px; color: #e2f1f4; background: rgba(255,255,255,.12); box-shadow: 0 3px 0 rgba(0,0,0,.3); margin-top: 12px; }
  .lv { display: flex; flex-direction: column; gap: 2px; text-align: left; margin: 8px 0; padding: 10px 14px; border-radius: 12px; cursor: pointer;
        background: rgba(255,255,255,.07); border: 1.5px solid rgba(255,255,255,.14); }
  .lv b { font-size: 16px; } .lv span { font-size: 12px; color: #9fd0dc; }
  .lv.locked { cursor: default; opacity: .55; }
  .lock { display: inline-block; position: relative; width: 11px; height: 9px; margin-right: 7px; border-radius: 2px; background: #cfe6ea; }
  .lock::before { content: ''; position: absolute; left: 1.5px; top: -6px; width: 4px; height: 6px; border: 2px solid #cfe6ea; border-bottom: 0; border-radius: 4px 4px 0 0; }
  .lv.sel { background: rgba(255,210,63,.16); border-color: #ffd23f; }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #b8600b; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay"><div id="panel"></div></div>
</div>
<script>
(() => {
'use strict';

// ---------- 基础 ----------
const W = 480;                 // 逻辑宽度
let H = 800;                   // 逻辑高度（随屏幕比例变化）
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const FONT = '-apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif';
const TAU = Math.PI * 2;

const chunks = new Map();     // 预渲染的地形分块
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  H = Math.max(640, Math.min(1100, Math.round(W * wh / ww)));
  const scale = Math.min(ww / W, wh / H);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  wrap.style.width = canvas.style.width = W * scale + 'px';
  wrap.style.height = canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * scale * dpr);
  canvas.height = Math.round(H * scale * dpr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  chunks.clear();
}
window.addEventListener('resize', resize);
resize();

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash(i, salt) {            // 稳定的装饰用伪随机 0..1
  let x = Math.imul(i | 0, 374761393) + Math.imul(salt | 0, 668265263);
  x = Math.imul(x ^ x >>> 13, 1274126177); return ((x ^ x >>> 16) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const store = {
  get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- 程序化贴图 ----------
const TS = 256;
function makeFbm(p0, oct, seed) {            // 可平铺的分形噪声，输入 0..1
  const rnd = mulberry32(seed), grids = [];
  for (let o = 0; o < oct; o++) { const p = p0 << o, g = new Float32Array(p * p); for (let i = 0; i < g.length; i++) g[i] = rnd(); grids.push([p, g]); }
  return (u, v) => {
    let sum = 0, amp = 0.5, tot = 0;
    for (const [p, g] of grids) {
      const x = u * p, y = v * p, x0 = Math.floor(x), y0 = Math.floor(y);
      let fx = x - x0, fy = y - y0; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = x0 % p, b = (x0 + 1) % p, c = (y0 % p) * p, e = ((y0 + 1) % p) * p;
      sum += amp * lerp(lerp(g[c + a], g[c + b], fx), lerp(g[e + a], g[e + b], fx), fy);
      tot += amp; amp *= 0.5;
    }
    return sum / tot;
  };
}
function makeTex(fn, after) {
  const c = document.createElement('canvas'); c.width = c.height = TS;
  const g = c.getContext('2d'), img = g.createImageData(TS, TS), px = img.data;
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const col = fn(x / TS, y / TS), i = (y * TS + x) * 4;
    px[i] = col[0]; px[i + 1] = col[1]; px[i + 2] = col[2]; px[i + 3] = col[3] === undefined ? 255 : col[3];
  }
  g.putImageData(img, 0, 0);
  if (after) after(g);
  return c;
}
function wrapDraw(g, x, y, r, fn) {           // 跨边界的元素重复绘制以保证平铺
  for (const ox of [0, -TS, TS]) for (const oy of [0, -TS, TS]) {
    if (x + ox < -r || x + ox > TS + r || y + oy < -r || y + oy > TS + r) continue;
    fn(x + ox, y + oy);
  }
}
const TEX = (() => {
  const f1 = makeFbm(4, 4, 11), f2 = makeFbm(32, 2, 12), f3 = makeFbm(11, 3, 13), f4 = makeFbm(18, 2, 14), f5 = makeFbm(6, 4, 15), rnd = mulberry32(99);
  const grass = makeTex((u, v) => {
    const t = clamp(f1(u, v) * 1.5 - 0.25 + (f2(u, v) - 0.5) * 0.45, 0, 1);
    return [lerp(58, 122, t), lerp(92, 156, t), lerp(42, 72, t)];
  }, g => {
    for (let i = 0; i < 1500; i++) {
      const x = rnd() * TS, y = rnd() * TS, l = 2 + rnd() * 4;
      g.strokeStyle = rnd() < 0.5 ? 'rgba(160,196,96,.28)' : 'rgba(34,66,30,.3)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + (rnd() - 0.5) * 3, y - l); g.stroke();
    }
  });
  const gravel = makeTex((u, v) => {
    const t = f5(u, v) + (f2(u, v) - 0.5) * 0.5;
    return [lerp(142, 196, t), lerp(128, 180, t), lerp(100, 146, t)];
  }, g => {
    for (let i = 0; i < 420; i++) {
      const x = rnd() * TS, y = rnd() * TS, r = 1 + rnd() * 2.6, sh = 110 + rnd() * 110 | 0;
      wrapDraw(g, x, y, 4, (px, py) => {
        g.fillStyle = 'rgba(40,34,24,.35)'; g.beginPath(); g.ellipse(px + 0.7, py + 0.9, r, r * 0.75, 0, 0, TAU); g.fill();
        g.fillStyle = `rgb(${sh},${sh - 6},${sh - 20})`; g.beginPath(); g.ellipse(px, py, r, r * 0.75, 0, 0, TAU); g.fill();
      });
    }
  });
  const bed = makeTex((u, v) => { const t = f5(u, v); return [lerp(52, 84, t), lerp(62, 92, t), lerp(50, 70, t)]; }, g => {
    for (let i = 0; i < 300; i++) {
      const x = rnd() * TS, y = rnd() * TS, r = 3 + rnd() * 8, rot = rnd() * 3, sh = 80 + rnd() * 80 | 0, warm = rnd() * 22 | 0;
      wrapDraw(g, x, y, 12, (px, py) => {
        g.fillStyle = 'rgba(16,24,22,.55)'; g.beginPath(); g.ellipse(px + 1.5, py + 2, r, r * 0.7, rot, 0, TAU); g.fill();
        g.fillStyle = `rgb(${sh + warm},${sh + warm * 0.5 | 0},${sh - 8})`; g.beginPath(); g.ellipse(px, py, r, r * 0.7, rot, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,255,.14)'; g.beginPath(); g.ellipse(px - r * 0.25, py - r * 0.2, r * 0.45, r * 0.28, rot, 0, TAU); g.fill();
      });
    }
  });
  const cliff = makeTex((u, v) => {      // 峡谷岩面：带层理的褐灰色岩石
    const n = f1(u, v), t = clamp(n * 1.2 - 0.1 + Math.sin((v * 9 + n * 2.2) * TAU) * 0.1 + (f2(u, v) - 0.5) * 0.35, 0, 1);
    return [lerp(84, 164, t), lerp(72, 142, t), lerp(60, 112, t)];
  }, g => {
    for (let i = 0; i < 70; i++) {
      let x = rnd() * TS, y = rnd() * TS; g.strokeStyle = 'rgba(30,22,14,.4)'; g.lineWidth = 0.8 + rnd(); g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 4; k++) { x += (rnd() - 0.3) * 16; y += (rnd() - 0.5) * 9; g.lineTo(x, y); } g.stroke();
    }
    for (let i = 0; i < 260; i++) { g.fillStyle = rnd() < 0.5 ? 'rgba(76,104,52,.3)' : 'rgba(200,186,160,.25)'; g.beginPath(); g.arc(rnd() * TS, rnd() * TS, 1 + rnd() * 2.5, 0, TAU); g.fill(); }
  });
  const ridge = (f, pw) => (u, v) => { const r = 1 - Math.abs(2 * f(u, v) - 1); return [255, 255, 255, Math.pow(r, pw) * 255]; };
  return { grass, cliff, gravel, bed, ripA: makeTex(ridge(f3, 7)), ripB: makeTex(ridge(f4, 26)), foam: makeTex((u, v) => {
    const a = clamp((f5(u, v) + (f2(u, v) - 0.5) * 0.6 - 0.5) * 6, 0, 1); return [255, 255, 255, a * 255]; }) };
})();
const PAT = {};
for (const k in TEX) PAT[k] = ctx.createPattern(TEX[k], 'repeat');

// 树冠贴图：由许多受光的叶团叠成
const TREES = (() => {
  const out = [], rnd = mulberry32(7), L = [-0.62, -0.78];
  const pal = [[[22, 58, 26], [58, 118, 44], [150, 190, 92]], [[30, 62, 22], [84, 128, 42], [176, 198, 96]], [[16, 48, 30], [40, 98, 52], [120, 170, 100]]];
  for (let v = 0; v < 5; v++) {
    const c = document.createElement('canvas'); c.width = c.height = 96; const g = c.getContext('2d'); g.translate(48, 48);
    const p = pal[v % 3];
    if (v === 4) {      // 针叶树：放射状
      for (let ring = 0; ring < 4; ring++) {
        const R = 32 - ring * 8, n = 13 - ring * 2, t = ring / 3;
        g.fillStyle = `rgb(${lerp(14, 60, t)},${lerp(44, 110, t)},${lerp(30, 58, t)})`;
        g.beginPath();
        for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * TAU + ring * 0.4, rr = i % 2 ? R * 0.55 : R; g.lineTo(Math.cos(a) * rr - ring * 1.5, Math.sin(a) * rr - ring * 1.8); }
        g.closePath(); g.fill();
      }
    } else {
      const blobs = [];
      for (let i = 0; i < 46; i++) { const a = rnd() * TAU, d = Math.sqrt(rnd()) * 27; blobs.push([Math.cos(a) * d, Math.sin(a) * d, 6 + rnd() * 8]); }
      blobs.sort((a, b) => (b[0] * L[0] + b[1] * L[1]) - (a[0] * L[0] + a[1] * L[1])).reverse();
      for (const [x, y, r] of blobs) {
        const t = clamp(0.5 + (x * L[0] + y * L[1]) / 44 + (rnd() - 0.5) * 0.3, 0, 1);
        const a = t < 0.5 ? p[0] : p[1], b = t < 0.5 ? p[1] : p[2], k = t < 0.5 ? t * 2 : t * 2 - 1;
        g.fillStyle = `rgb(${lerp(a[0], b[0], k) | 0},${lerp(a[1], b[1], k) | 0},${lerp(a[2], b[2], k) | 0})`;
        g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
        g.fillStyle = 'rgba(255,255,220,.08)'; g.beginPath(); g.arc(x - r * 0.3, y - r * 0.35, r * 0.5, 0, TAU); g.fill();
      }
    }
    out.push(c);
  }
  return out;
})();

// ---------- 关卡 ----------
// 坐标：x 横向，d 为顺流距离（屏幕向上）。
const RAFT_R = 14, WAVE_GAP = 46, NUM = '一二三四五';
const tSteer = isTouch ? '按住屏幕左侧 / 右侧  划桨转向' : '←  →  划桨转向';
const tSprint = isTouch ? '按住中间按钮  冲刺' : '按住空格  冲刺（消耗体力）';
const LEVELS = [
  { id: 1, name: '青溪谷', theme: 'forest', seed: 20261112, end: 9000, flow: 85, par: 60, w0: 118,
    intro: '沿着星星走，避开礁石与漂木。',
    cx: d => W / 2 + 60 * smooth(200, 900, d) * (Math.sin(d / 610) * 0.7 + Math.sin(d / 233 + 2) * 0.3),
    w: d => 118 + 14 * Math.sin(d / 400) - 14 * smooth(3000, 3600, d) * (1 - smooth(4600, 5200, d)),
    safe: d => 0.55 * Math.sin(d / 520 + 1) * smooth(300, 1000, d),
    rockStart: 1000, gap: [210, 95, 190], clear: 50, logLen: 26, logPad: 14, gates: [], gateGap: 52, whirls: [],
    boosts: [[3300, 3900], [5900, 6400], [7700, 8500]], bridges: [2695, 6595],
    logs: [5250, 5650, 6700, 7300], rings: [4570, 7450], ducks: [[620, -1], [2130, 1], [4230, -1], [5460, 1], [8640, -1]],
    signs: [[120, tSteer], [470, isTouch ? '两侧同时按住  划桨前进' : '按 ↑ 划桨前进'], [820, '沿着星星走，避开礁石！'], [1400, tSprint],
      [3180, '前方急流！'], [4420, '救生圈可以补气'], [5080, '小心漂木，看准时机！'], [7560, '最后冲刺！']] },
  { id: 2, name: '鹰嘴峡', theme: 'canyon', seed: 7302119, end: 11000, flow: 96, par: 60, w0: 104,
    intro: '峡谷更窄、水更急，还有会把艇吸进去的漩涡。',
    cx: d => W / 2 + 78 * smooth(200, 800, d) * (Math.sin(d / 470) * 0.72 + Math.sin(d / 190 + 1) * 0.28),
    w: d => 104 + 12 * Math.sin(d / 330 + 1) - 10 * smooth(6000, 6500, d) * (1 - smooth(8200, 8700, d)),
    safe: d => 0.5 * Math.sin(d / 430 + 2) * smooth(300, 900, d),
    rockStart: 700, gap: [175, 80, 170], clear: 47, logLen: 21, logPad: 8, gates: [2300, 4700, 7050, 9600], gateGap: 50, whirls: [1150, 4950, 5500, 7350, 10550],
    boosts: [[1500, 2100], [3600, 4500], [6200, 6900], [8800, 10300]], bridges: [2850, 7650],
    logs: [2550, 3250, 5200, 5800, 7900, 8350], rings: [3350, 6000, 9050], ducks: [[420, 1], [5350, -1]],
    signs: [[100, '鹰嘴峡：河道更窄，水流更急'], [850, '漩涡会把艇吸过去——绕开，或冲刺甩脱'], [2020, '石门：从缺口穿过去'],
      [3420, '长急流，稳住方向！'], [4700, '连环漩涡'], [8620, '最后一段险滩！']] },
];
const THEMES = {
  forest: { ground: 'grass', treeSkip: 0.14, kinds: [0, 1, 2, 3, 4], flowers: true, reeds: 0.5, cliff: 0,
    tint: 'rgba(64,142,128,.5)', depth: ['rgba(46,124,122,.45)', 'rgba(34,108,116,.5)', 'rgba(26,92,108,.5)', 'rgba(20,78,98,.5)', 'rgba(15,66,88,.45)', 'rgba(12,58,80,.35)'] },
  canyon: { ground: 'cliff', treeSkip: 0.62, kinds: [4, 4, 2], flowers: false, reeds: 0.16, cliff: 1,
    tint: 'rgba(52,118,112,.55)', depth: ['rgba(38,104,108,.5)', 'rgba(28,90,104,.5)', 'rgba(20,76,96,.55)', 'rgba(14,62,86,.55)', 'rgba(10,50,76,.5)', 'rgba(8,42,66,.4)'] },
};
let LV, TH, END, BASE_FLOW, PAR_TIME, BOOSTS, BRIDGES, SIGNS;
function setLevel(i) {
  LV = LEVELS[clamp(i | 0, 0, LEVELS.length - 1)]; TH = THEMES[LV.theme];
  END = LV.end; BASE_FLOW = LV.flow; PAR_TIME = LV.par; BOOSTS = LV.boosts; BRIDGES = LV.bridges; SIGNS = LV.signs;
  chunks.clear();
}
const lvTitle = lv => `第${NUM[lv.id - 1]}关 · ${lv.name}`, bestKey = lv => `raft_l${lv.id}_best`;

const riverCx = d => LV.cx(d);
const riverW = d => LV.w(d);
const riverSlope = d => (riverCx(d + 4) - riverCx(d - 4)) / 8;
const edgeX = (d, s) => riverCx(d) + s * (riverW(d) + 3 + 3 * Math.sin(d * 0.045 + s) + 2 * Math.sin(d * 0.113 + s * 2.3));   // 仅用于绘制的不规则河岸
// 安全航线：星星沿此摆放，礁石避开它，保证关卡可通过
const safeX = d => riverCx(d) + riverW(d) * LV.safe(d);
const boostAt = d => { for (const [a, b] of BOOSTS) if (d > a && d < b) return Math.min(1, (d - a) / 80, (b - d) / 80); return 0; };

let rocks, logs, coins, rings, ducks, whirls;
function buildLevel() {
  const rnd = mulberry32(LV.seed);
  rocks = []; logs = []; coins = []; rings = []; ducks = []; whirls = [];
  for (const ld of LV.logs) logs.push({ d: ld, ph: rnd() * TAU, sp: 0.7 + rnd() * 0.4, x: 0, len: LV.logLen, lock: false });
  for (const rd of LV.rings) rings.push({ d: rd, x: riverCx(rd) - (safeX(rd) - riverCx(rd)) * 0.85, got: false });
  for (const wd of LV.whirls) {       // 漩涡放在安全航线的另一侧，航线只擦过它的外缘
    const s = safeX(wd) >= riverCx(wd) ? -1 : 1; let x = riverCx(wd) + s * riverW(wd) * 0.5;
    if (Math.abs(x - safeX(wd)) < 74) x = safeX(wd) + s * 74;
    whirls.push({ x, d: wd, R: 105, dir: s, lock: false, seed: whirls.length });
  }
  let d = LV.rockStart;
  while (d < END - 250) {
    const diff = smooth(LV.rockStart, END * 0.78, d), inBoost = boostAt(d) > 0, r = 13 + rnd() * 10;
    for (let k = 0; k < 10; k++) {
      const w = riverW(d), x = riverCx(d) + (rnd() * 2 - 1) * (w - r - 4);
      if (Math.abs(x - safeX(d)) > r + LV.clear) { rocks.push({ x, d, r }); break; }
    }

// 水流场：中间快、岸边慢，河道越窄越急；遇到礁石会分流绕行，石后是缓流区

// ---------- 状态 ----------

           phL: 0, phR: 0, dirL: 1, dirR: 1, hits: 0, sink: 0, squash: 0, near: 0, bump: 0, rel: 0, st: 0, stam: 1, tired: false, sprint: false };

// ---------- 声音 ----------
let ac = null, master = null, ambGain = null, ambLp = null, hissGain = null, noiseBuf = null, nextBird = 0;

const sfx = {

  stroke: () => { swish(0.07, 1100, 0.26); beep(190, 0.07, 'sine', 0.05, -90); },
  wave: () => { swish(0.1, 1800, 0.3, 0.5); },
  hit: () => { beep(95, 0.3, 'sine', 0.3, -50); beep(240, 0.12, 'triangle', 0.08, -120); swish(0.22, 700, 0.5, 0.4); },
  bank: () => { swish(0.08, 420, 0.22, 1.2); },
  ring: () => { [523, 784, 1047].forEach((f, i) => beep(f, 0.14, 'sine', 0.1, 0, i * 0.07)); },
  near: () => { swish(0.07, 2400, 0.18); },
  duck: () => { beep(620, 0.07, 'square', 0.03, -200); beep(560, 0.09, 'square', 0.03, -200, 0.11); swish(0.06, 2000, 0.3); },

  go: () => { beep(1040, 0.3, 'triangle', 0.12); },
  win: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.22, 'triangle', 0.12, 0, i * 0.13)); },

// ---------- 逻辑 ----------
function splash(x, d, n, color = '#fff', sp = 130) {
  for (let i = 0; i < n; i++) {
    const an = Math.random() * TAU, s = sp * (0.3 + Math.random() * 0.7);
    particles.push({ x, d, vx: Math.cos(an) * s, vd: Math.sin(an) * s, life: 0.5 + Math.random() * 0.4, max: 0.9, r: 1.5 + Math.random() * 2.5, color });
  }
}
function floatText(text, x, d, color = '#fff', size = 16) { floaters.push({ text, x, d, color, size, life: 1 }); }

// 碰到障碍：橡皮艇会弹开并被撞得打转；同一障碍在分开前不会重复扣血

  raft.vx += nx * 90; raft.vd += nd * 90;
  if (obj.lock || raft.inv > 0 || state !== 'play') return;
  raft.av += 4 * (nx * Math.cos(raft.a) - nd * Math.sin(raft.a)) + (Math.random() - 0.5) * 2;
  obj.lock = true; obj.hit = true;
  raft.hp--; raft.hits++; raft.inv = 2; raft.squash = 1; raft.combo = 0; shake = 0.35; flash = 0.22;
  splash(raft.x - nx * RAFT_R, raft.d - nd * RAFT_R, 22, 'rgba(255,255,255,.9)', 170);
  floatText('-1', raft.x, raft.d + 24, '#ff8787', 20);
  sfx.hit();
  if (raft.hp <= 0) { state = 'dead'; sfx.dead(); setTimeout(showDead, 1300); }
}

const STROKE_RATE = 1.6, POWER = 0.45, PADDLE_F = 172, STEER_A = 0.6, STEER_K = 17, DRAW_F = 130, KF = 1.1, KS = 3.5, KAV = 6;

function strokeSide(key, active, dir, dt, s) {

  const before = ph; ph += STROKE_RATE * strokeMul * dt;
  if (before < 0.04 && ph >= 0.04) {           // 入水
    const c = Math.cos(raft.a), si = Math.sin(raft.a), dd = raft[key === 'phL' ? 'dirL' : 'dirR'];
    for (const ly of [-16 * dd, -2 * dd]) splash(raft.x + s * 25 * c - ly * si * -1, raft.d - s * 25 * si - ly * c, 3, 'rgba(255,255,255,.85)', 50);
  }
  if (ph >= 1) { ph = active ? ph - 1 : 0; if (active) raft[key === 'phL' ? 'dirL' : 'dirR'] = dir; }
  raft[key] = ph;

  return PADDLE_F * (0.3 + 0.7 * (ph > 0 && ph < POWER ? Math.sin(Math.PI * ph / POWER) : 0)) * dir;
}

let bankSfxCd = 0, strokeSfxCd = 0;
function update(dt) {

    const p = particles[i]; p.life -= dt; p.x += p.vx * dt; p.d += p.vd * dt; p.vx *= 0.96; p.vd *= 0.96;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = wake.length - 1; i >= 0; i--) { const k = wake[i]; k.life -= dt; k.x += k.vx * dt; k.d += k.vd * dt; if (k.life <= 0) wake.splice(i, 1); }
  for (let i = floaters.length - 1; i >= 0; i--) { const f = floaters[i]; f.life -= dt * 1.1; f.d += 34 * dt; if (f.life <= 0) floaters.splice(i, 1); }
  for (let i = confetti.length - 1; i >= 0; i--) {

  // 转向是渐进的：轻点微调，按住才逐渐打到最大角度
  const rate = (steer ? 2 : 2.6) * dt; raft.st += clamp((playing ? steer : 0) - raft.st, -rate, rate);

      else { raft.score += 300; floatText('+300', g.x, g.d + 16, '#ffe066', 17); }
    }
    if (state === 'play' && raft.d >= END) win();
  } else if (state === 'dead') {
    raft.sink = Math.min(1, raft.sink + dt * 0.9);
    if (Math.random() < dt * 16) particles.push({ x: raft.x + (Math.random() - 0.5) * 22, d: raft.d + (Math.random() - 0.5) * 22, vx: 0, vd: 20, life: 0.6, max: 0.6, r: 1.5 + Math.random() * 3, color: 'rgba(255,255,255,.8)' });
  }
  cam.d += (raft.d + raft.vd * 0.25 - cam.d) * Math.min(1, 5 * dt);
}

let result = null;
function win() {
  state = 'win'; sfx.win();
  const timeBonus = Math.round(Math.max(0, PAR_TIME + 20 - raft.time) * 30), hpBonus = raft.hp * 500;
  const total = coins.length, gotCoins = raft.coins >= Math.ceil(total * 0.8), clean = raft.hits === 0;
  result = { stars: 1 + (gotCoins ? 1 : 0) + (clean ? 1 : 0), gotCoins, clean, timeBonus, hpBonus,
             score: raft.score + timeBonus + hpBonus, time: raft.time, fast: raft.time <= PAR_TIME };
  const COL = ['#ffd23f', '#ff6b6b', '#4dabf7', '#69db7c', '#ffffff', '#ff922b'];
  for (let i = 0; i < 110; i++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * 320, vy: 110 + Math.random() * 150,
    vx: (Math.random() - 0.5) * 50, rot: Math.random() * TAU, vr: (Math.random() - 0.5) * 12, ph: Math.random() * TAU, c: COL[i % COL.length], s: 5 + Math.random() * 5 });
  setTimeout(showWin, 1100);
}

// ---------- 绘制 ----------
let baseY = 0, camD = 0;
const Y = d => baseY - (d - camD);
const SUN = [6, 9];             // 影子偏移（阳光来自左上）

function star(x, y, r, rot = 0) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath();
}
function heart(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.7, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9);
  ctx.closePath();
}
function outlined(text, x, y, size, fill = '#fff', align = 'center') {
  ctx.font = `700 ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size * 0.26); ctx.strokeStyle = 'rgba(6,30,40,.85)'; ctx.strokeText(text, x, y);
  ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); };
const oval = (x, y, rx, ry, rot = 0) => { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); };
// 用平铺贴图填满当前裁剪区；(ox, oy) 为贴图偏移，(sx, sy) 为缩放
function fillPattern(pat, ox, oy, sx = 1, sy = sx, alpha = 1, op = 'source-over') {
  ctx.save(); ctx.globalAlpha = alpha; ctx.globalCompositeOperation = op; ctx.fillStyle = pat;
  const px = TS * sx, py = TS * sy;
  ctx.translate(((ox % px) + px) % px - px, ((oy % py) + py) % py - py); ctx.scale(sx, sy);
  ctx.fillRect(0, 0, (W + 60) / sx + TS * 2, (H + 60) / sy + TS * 2);
  ctx.restore();
}

function drawBanner(d, label, c1, c2) {
  const y = Y(d); if (y < -40 || y > H + 40) return;
  const xl = riverCx(d) - riverW(d) - 8, xr = riverCx(d) + riverW(d) + 8;
  ctx.strokeStyle = 'rgba(0,25,35,.25)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(xl + SUN[0], y + SUN[1]); ctx.lineTo(xr + SUN[0], y + SUN[1]); ctx.stroke();
  ctx.strokeStyle = '#e9e4d4'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xl, y); ctx.lineTo(xr, y); ctx.stroke();
  const n = 16, cw = (xr - xl) / n;
  for (let i = 0; i < n; i++) {      // 一串小旗
    const x = xl + (i + 0.5) * cw, fl = Math.sin(T * 4 + i) * 1.5;
    ctx.fillStyle = i % 2 ? c1 : c2; ctx.beginPath(); ctx.moveTo(x - cw * 0.36, y); ctx.lineTo(x + cw * 0.36, y); ctx.lineTo(x + fl, y + 11); ctx.closePath(); ctx.fill();
  }
  for (const x of [xl, xr]) {
    ctx.fillStyle = 'rgba(0,25,35,.3)'; oval(x + SUN[0], y + SUN[1], 5, 4); ctx.fill();
    const g = ctx.createRadialGradient(x - 1.5, y - 1.5, 0.5, x, y, 5); g.addColorStop(0, '#a98458'); g.addColorStop(1, '#4e3520');
    ctx.fillStyle = g; circle(x, y, 4.5); ctx.fill();
  }
  outlined(label, (xl + xr) / 2, y - 16, 17, '#fff');
}

function drawBridge(d) {
  const y = Y(d); if (y < -70 || y > H + 70) return;
  const xl = riverCx(d) - riverW(d) - 36, xr = riverCx(d) + riverW(d) + 36, h = 34;
  ctx.fillStyle = 'rgba(0,22,30,.3)'; ctx.fillRect(xl + SUN[0] * 1.8, y - h / 2 + SUN[1] * 1.8, xr - xl, h);
  for (let x = xl, i = 0; x < xr; x += 9, i++) {      // 每块木板深浅略有不同
    const t = hash(i, d | 0), sh = 118 + t * 44 | 0;
    ctx.fillStyle = `rgb(${sh + 30},${sh - 6},${sh - 52})`; ctx.fillRect(x, y - h / 2, Math.min(8.3, xr - x), h);
  }
  const lg = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  lg.addColorStop(0, 'rgba(255,240,200,.16)'); lg.addColorStop(0.5, 'rgba(0,0,0,0)'); lg.addColorStop(1, 'rgba(0,0,0,.2)');
  ctx.fillStyle = lg; ctx.fillRect(xl, y - h / 2, xr - xl, h);
  for (const yy of [y - h / 2, y + h / 2]) {          // 栏杆
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(xl, yy, xr - xl, 5);
    ctx.fillStyle = '#6e4a2a'; ctx.fillRect(xl, yy - 3.5, xr - xl, 5);
    ctx.fillStyle = '#9a6f44'; ctx.fillRect(xl, yy - 3.5, xr - xl, 1.5);
    for (const x of [xl, xl + (xr - xl) / 3, xl + (xr - xl) * 2 / 3, xr]) { ctx.fillStyle = '#3f2913'; ctx.fillRect(x - 4, yy - 5.5, 8, 9); ctx.fillStyle = '#7a5532'; ctx.fillRect(x - 4, yy - 5.5, 8, 2.5); }
  }
}

function drawRock(r) {
  const y = Y(r.d), n = r.pts.length;
  const shape = (ox, oy, k) => {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a0 = i / n * TAU, a1 = (i + 0.5) / n * TAU, p0 = r.pts[i % n] * k, p1 = (r.pts[i % n] + r.pts[(i + 1) % n]) / 2 * k;
      const mx = r.x + ox + Math.cos(a1) * p1, my = y + oy + Math.sin(a1) * p1;
      if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(r.x + ox + Math.cos(a0) * p0, y + oy + Math.sin(a0) * p0, mx, my);
    }
    ctx.closePath();
  };
  ctx.fillStyle = 'rgba(8,30,38,.3)'; shape(0, 0, 1.38); ctx.fill();                   // 水下部分
  ctx.fillStyle = 'rgba(0,18,26,.38)'; shape(SUN[0] * 0.8, SUN[1] * 0.8, 1.02); ctx.fill();   // 投影
  // 迎水面的白浪枕
  const pul = Math.sin(T * 6 + r.seed) * 1.2;
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 3.5 + pul * 0.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.ellipse(r.x, y + 1, r.r + 2.5, r.r + 3.5 + pul, 0, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(r.x, y + 2, r.r + 6, r.r + 8 + pul, 0, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.fillStyle = '#23292c'; shape(0, 0.8, 1.06); ctx.fill();                          // 水线处的湿石
  const g = ctx.createRadialGradient(r.x - r.r * 0.4, y - r.r * 0.45, r.r * 0.1, r.x, y, r.r * 1.15);
  g.addColorStop(0, '#c2c2b6'); g.addColorStop(0.45, '#878a84'); g.addColorStop(1, '#3f4548');
  ctx.fillStyle = g; shape(0, 0, 1); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(30,34,36,.4)'; ctx.lineWidth = 1;                             // 裂纹
  for (let k = 0; k < 3; k++) {
    const a = hash(r.seed, 20 + k) * TAU, l = r.r * (0.5 + hash(r.seed, 30 + k) * 0.5);
    ctx.beginPath(); ctx.moveTo(r.x + Math.cos(a) * r.r * 0.15, y + Math.sin(a) * r.r * 0.15);
    ctx.lineTo(r.x + Math.cos(a + 0.3) * l * 0.6, y + Math.sin(a + 0.3) * l * 0.6); ctx.lineTo(r.x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
  }
  if (hash(r.seed, 77) > 0.45) { ctx.fillStyle = 'rgba(84,120,40,.75)'; oval(r.x + r.r * 0.35, y + r.r * 0.3, r.r * 0.45, r.r * 0.3, 0.4); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,245,.2)'; oval(r.x - r.r * 0.32, y - r.r * 0.36, r.r * 0.34, r.r * 0.2, -0.6); ctx.fill();
  ctx.restore();
}

function drawLog(l) {
  const y = Y(l.d), x0 = l.x - l.len - 6, x1 = l.x + l.len + 6;
  ctx.fillStyle = 'rgba(0,18,26,.35)'; ctx.beginPath(); ctx.roundRect(x0 + SUN[0] * 0.6, y - 8 + SUN[1] * 0.6, x1 - x0, 16, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 3; ctx.lineCap = 'round';      // 迎水面浪花
  ctx.beginPath(); ctx.moveTo(x0 + 2, y + 9.5 + Math.sin(T * 5 + l.d) * 0.8); ctx.lineTo(x1 - 2, y + 9.5 + Math.cos(T * 5 + l.d) * 0.8); ctx.stroke();
  const g = ctx.createLinearGradient(0, y - 8, 0, y + 8);
  g.addColorStop(0, '#5a3d24'); g.addColorStop(0.3, '#9a7148'); g.addColorStop(0.55, '#77532f'); g.addColorStop(1, '#2e1d0f');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x0, y - 8, x1 - x0, 16, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(38,22,10,.55)'; ctx.lineWidth = 1;                                // 树皮纹
  for (let k = 0; k < 6; k++) {
    const yy = y - 5.5 + k * 2.2, a = x0 + 6 + hash(k, l.d | 0) * 14, b = x1 - 10 - hash(k, 3 + (l.d | 0)) * 14;
    ctx.beginPath(); ctx.moveTo(a, yy); ctx.lineTo((a + b) / 2, yy + (hash(k, 9) - 0.5) * 1.5); ctx.lineTo(b, yy); ctx.stroke();
  }
  ctx.fillStyle = '#4a321c'; ctx.beginPath(); ctx.roundRect(l.x - 9, y - 12.5, 5, 6, 2); ctx.fill();   // 断枝
  ctx.fillStyle = '#c9a877'; oval(x1 - 1.5, y, 3, 6.8); ctx.fill();                          // 截面年轮
  ctx.strokeStyle = '#8a6540'; ctx.lineWidth = 0.9; oval(x1 - 1.5, y, 1.7, 4.2); ctx.stroke(); oval(x1 - 1.5, y, 0.6, 1.8); ctx.stroke();
}

const VEST = ['#e03131', '#f08c00', '#e03131', '#f08c00'], HELM = ['#f1f3f5', '#ffd43b', '#4dabf7', '#f1f3f5'];
function drawRaft() {
  const x = raft.x, y = Y(raft.d);
  if (raft.inv > 0 && state === 'play' && Math.floor(raft.inv * 12) % 2) return;
  const lift = raft.bump * (1 - raft.bump) * 4;
  ctx.save(); ctx.translate(x, y);
  // 水下的影子
  ctx.save(); ctx.translate(SUN[0] * (0.7 + lift * 0.4), SUN[1] * (0.7 + lift * 0.4)); ctx.rotate(raft.a);
  ctx.fillStyle = 'rgba(0,18,26,.38)'; ctx.beginPath(); ctx.roundRect(-14, -24, 28, 48, [13, 13, 10, 10]); ctx.fill(); ctx.restore();
  ctx.rotate(raft.a);
  // 艇首浪花
  const bow = clamp(raft.rel / 150, 0, 1);
  if (bow > 0.08 && !raft.sink) {
    ctx.strokeStyle = `rgba(255,255,255,${0.75 * bow})`; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 3, -26); ctx.quadraticCurveTo(s * 15, -23, s * (18 + bow * 8), -8 + bow * 10); ctx.stroke(); }
    ctx.fillStyle = `rgba(255,255,255,${0.5 * bow})`; oval(0, -25.5, 9, 3); ctx.fill();
  }
  const sc = (1 - raft.sink * 0.5) * (1 + lift * 0.035);
  ctx.scale(sc * (1 + raft.squash * 0.2), sc * (1 - raft.squash * 0.15)); ctx.globalAlpha = 1 - raft.sink * 0.7;

  // 桨（在队员之下）
  const seats = [[-1, -9, raft.phL, raft.dirL], [-1, 5, raft.phL, raft.dirL], [1, -9, raft.phR, raft.dirR], [1, 5, raft.phR, raft.dirR]];
  const blade = (ph, dir) => ph <= 0 ? [-1, false] : ph < POWER ? [lerp(-8, 8, ph / POWER) * dir, true] : [lerp(8, -8, (ph - POWER) / (1 - POWER)) * dir, false];
  for (const [s, sy, ph, dir] of seats) {
    const [by, wet] = blade(ph, dir), bx = s * (wet ? 24 : 22), yy = sy + by;
    ctx.strokeStyle = '#2b2b2b'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 6, sy + by * 0.25 - 1); ctx.lineTo(bx, yy); ctx.stroke();
    if (wet) { ctx.fillStyle = 'rgba(255,255,255,.6)'; oval(bx + s * 2, yy + 1, 5.5, 3.5); ctx.fill(); }
    ctx.fillStyle = wet ? '#c9a227' : '#ffd43b';
    ctx.save(); ctx.translate(bx + s * 3, yy); ctx.rotate(s * by * 0.03); ctx.beginPath(); ctx.roundRect(-4.5, wet ? -1.6 : -2.6, 9, wet ? 3.2 : 5.2, 1.5); ctx.fill(); ctx.restore();
  }
  // 气囊：横向渐变做出圆筒的体积感
  const hull = k => { ctx.beginPath(); ctx.roundRect(-14 + k, -24 + k, 28 - 2 * k, 48 - 2 * k, [13 - k * 0.8, 13 - k * 0.8, Math.max(2, 10 - k), Math.max(2, 10 - k)]); };
  const tg = ctx.createLinearGradient(-14, 0, 14, 0);
  tg.addColorStop(0, '#8c2f0b'); tg.addColorStop(0.12, '#e8590c'); tg.addColorStop(0.2, '#ffb066'); tg.addColorStop(0.3, '#f76707');
  tg.addColorStop(0.7, '#f76707'); tg.addColorStop(0.78, '#ff9f4d'); tg.addColorStop(0.9, '#d9480f'); tg.addColorStop(1, '#7a2808');
  ctx.fillStyle = tg; hull(0); ctx.fill();
  const eg = ctx.createLinearGradient(0, -24, 0, 24);                                    // 首尾两端的明暗
  eg.addColorStop(0, 'rgba(255,225,170,.4)'); eg.addColorStop(0.14, 'rgba(255,225,170,0)'); eg.addColorStop(0.86, 'rgba(0,0,0,0)'); eg.addColorStop(1, 'rgba(60,15,0,.45)');
  ctx.fillStyle = eg; hull(0); ctx.fill();
  ctx.strokeStyle = 'rgba(70,20,0,.5)'; ctx.lineWidth = 0.8; hull(0.4); ctx.stroke();
  ctx.fillStyle = '#2f3b42'; hull(6.5); ctx.fill();                                      // 艇底
  ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 1.6; hull(6.5); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 0.7; ctx.beginPath();
  for (let i = -14; i <= 14; i += 3.5) { ctx.moveTo(-7, i); ctx.lineTo(7, i); } ctx.stroke();
  for (const ty of [-2, 11]) {                                                           // 横隔气囊
    const cg = ctx.createLinearGradient(0, ty - 2.6, 0, ty + 2.6);
    cg.addColorStop(0, '#ffa94d'); cg.addColorStop(0.5, '#f76707'); cg.addColorStop(1, '#8c2f0b');
    ctx.fillStyle = cg; ctx.fillRect(-7.5, ty - 2.6, 15, 5.2);
  }
  ctx.setLineDash([3, 2.2]); ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 0.8; hull(-0.6); ctx.stroke(); ctx.setLineDash([]);   // 安全绳
  // 四名队员：救生衣 + 头盔，随划桨前后俯仰
  seats.forEach(([s, sy, ph, dir], i) => {
    const [by] = blade(ph, dir), lean = by * 0.14;
    ctx.strokeStyle = '#3b5b7a'; ctx.lineWidth = 2; ctx.lineCap = 'round';               // 手臂
    ctx.beginPath(); ctx.moveTo(s * 8.5, sy - 1.5); ctx.lineTo(s * 12.5, sy + by * 0.5); ctx.moveTo(s * 7.5, sy + 1.5); ctx.lineTo(s * 8, sy + by * 0.3); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.3)'; oval(s * 9 + 1, sy + 1.6, 4.6, 3.8); ctx.fill();
    ctx.fillStyle = VEST[i]; oval(s * 9, sy + lean * 0.4, 4.4, 3.6); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.2)'; oval(s * 9 - 1, sy - 1 + lean * 0.4, 2.4, 1.6); ctx.fill();
    ctx.fillStyle = HELM[i]; circle(s * 9, sy - 0.6 + lean, 2.9); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.7)'; circle(s * 9 - 0.9, sy - 1.5 + lean, 0.9); ctx.fill();
  });
  ctx.restore();
}

function drawDuck(k) {
  const y = Y(k.d), fl = k.fly;
  if (fl > 1.2) return;
  ctx.save(); ctx.translate(k.x, y - fl * 20);
  ctx.globalAlpha = clamp(1.2 - fl, 0, 1);
  const sc = 1 + fl * 0.5; ctx.scale(sc * (k.s < 0 && fl ? -1 : 1), sc);
  if (!fl) {
    ctx.fillStyle = 'rgba(0,18,26,.3)'; oval(3, 4, 7, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.2; oval(0, 1, 10 + Math.sin(T * 3 + k.ph), 7.5); ctx.stroke();
  } else {
    const wg = Math.sin(T * 30) * 5;
    ctx.fillStyle = k.brown ? '#a47148' : '#f1f3f5';
    oval(0, -5 - wg * 0.4, 4, 7, 0.3); ctx.fill(); oval(0, 5 + wg * 0.4, 4, 7, -0.3); ctx.fill();
  }
  const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 8);
  if (k.brown) { g.addColorStop(0, '#a98058'); g.addColorStop(1, '#5a3d24'); } else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#b9c0c6'); }
  ctx.fillStyle = g; oval(0, 0, 7, 4.8); ctx.fill();
  ctx.fillStyle = k.brown ? '#1f6b34' : '#f4f4f4'; circle(6, -1.8, 3.1); ctx.fill();
  ctx.fillStyle = '#e8890c'; ctx.beginPath(); ctx.moveTo(8.3, -3.2); ctx.lineTo(12.5, -1.8); ctx.lineTo(8.3, -0.4); ctx.fill();
  ctx.fillStyle = '#16191b'; circle(6.8, -2.6, 0.7); ctx.fill();
  ctx.restore();
}

// 岸上的树木：位置由哈希决定，树影与树冠分两遍画
function eachTree(d0, d1, fn) {
  for (let i = Math.floor(d0 / 30) - 2; i <= d1 / 30 + 2; i++) for (const s of [-1, 1]) {
    if (hash(i, 80 + s) < TH.treeSkip) continue;
    const d = i * 30 + hash(i, 50 + s) * 26;
    if (BRIDGES.some(b => Math.abs(b - d) < 46) || Math.abs(d) < 34 || Math.abs(d - END) < 34) continue;
    const k = 0.5 + hash(i, 70 + s) * 0.62, edge = riverCx(d) + s * (riverW(d) + 8 + 36 * k), room = s < 0 ? edge + 20 : W + 20 - edge; if (room < 4) continue;
    const t = hash(i, 60 + s), x = edge + s * t * t * room;
    fn(x, d, k, TH.kinds[hash(i, 90 + s) * TH.kinds.length | 0], hash(i, 95 + s) * TAU, i);
  }
}

// 静态地形按 512 像素一段预渲染并缓存：下层（草地、河床、水色、树影）和上层（树冠）
const CH = 512;
function drawTerrain(d0, d1) {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, CH + 2); ctx.clip();
  fillPattern(PAT[TH.ground], 0, camD);
  for (let i = Math.floor(d0 / 110) - 1; i <= d1 / 110 + 1; i++) {
    ctx.fillStyle = hash(i, 1) > 0.5 ? 'rgba(24,52,22,.1)' : 'rgba(190,200,110,.07)';
    oval(hash(i, 2) * W, Y(i * 110 + hash(i, 3) * 110), 60 + hash(i, 4) * 70, 34 + hash(i, 5) * 30, hash(i, 6) * 3); ctx.fill();
  }
  const river = riverPath(d0, d1), mid = new Path2D();

    for (const [s, on] of [[-1, input.L], [1, input.R]]) {

      ctx.fillStyle = on ? 'rgba(255,255,255,.4)' : 'rgba(255,255,255,.16)';
      circle(x, y, 42); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.moveTo(x + s * 18, y); ctx.lineTo(x - s * 10, y - 18); ctx.lineTo(x - s * 10, y + 18); ctx.closePath(); ctx.fill();
    }
  }
}

// ---------- 界面 ----------
function show(html, buttons) {
  panel.innerHTML = html + '<div class="btns">' + buttons.map(([label], i) => `<button ${i ? 'class="alt"' : 'id="go"'} data-i="${i}">${label}</button>`).join('') + '</div>';
  panel.style.animation = 'none'; void panel.offsetWidth; panel.style.animation = '';
  overlay.classList.remove('hidden');
  panel.querySelectorAll('button[data-i]').forEach(b => { b.onclick = e => { e.stopPropagation(); buttons[b.dataset.i][1](); }; });
}
const starsHtml = n => `<div class="stars">${[0, 1, 2].map(i => `<span class="${i < n ? 'on' : 'off'}" style="--i:${i}">★</span>`).join('')}</div>`;
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, ',');

// 通关上一关才解锁下一关
const unlocked = i => i <= 0 || !!store.get(bestKey(LEVELS[i - 1]), null);
function showMenu() {
  state = 'menu';
  const cards = LEVELS.map((lv, i) => {
    const b = store.get(bestKey(lv), null);
    if (!unlocked(i)) return `<div class="lv locked"><b><i class="lock"></i>${lvTitle(lv)}</b><span>通关「${LEVELS[i - 1].name}」后解锁</span></div>`;
    return `<div class="lv${lv === LV ? ' sel' : ''}" data-lv="${i}"><b>${lvTitle(lv)}</b><span>${b ? `${'★'.repeat(b.stars)}${'☆'.repeat(3 - b.stars)} · ${fmt(b.score || 0)} 分` : lv.intro}</span></div>`;
  }).join('');
  show(`<h1>橡皮艇漂流</h1><h2>选择关卡</h2>${cards}
    <p class="small">${isTouch ? '按住屏幕<b>左侧 / 右侧</b>转向　两侧同时按住前进<br><b>中间按钮</b>冲刺'
      : '<kbd>←</kbd> <kbd>→</kbd> 转向　<kbd>↑</kbd> 前进　<kbd>↓</kbd> 倒划　<kbd>空格</kbd> 冲刺<br><kbd>P</kbd> 暂停　<kbd>M</kbd> 静音　<kbd>R</kbd> 重开'}</p>
    <p class="small">橡皮艇只经得起 3 次碰撞！</p>`, [['出发！', () => start()]]);
  panel.querySelectorAll('.lv[data-lv]').forEach(el => { el.onclick = e => {
    e.stopPropagation(); const i = +el.dataset.lv; if (!unlocked(i)) return;
    if (LEVELS[i] !== LV) { setLevel(i); store.set('raft_level', i); reset(); }
    showMenu();
  }; });
}
function start(skipCountdown, level) {
  audio(); if (level !== undefined && LEVELS[level] !== LV) { setLevel(level); store.set('raft_level', level); }
  reset(); overlay.classList.add('hidden');
  if (skipCountdown) { state = 'play'; raft.vd = 60; } else { state = 'ready'; countdown = 2.1; sfx.tick(); }
}
function toMenu() { reset(); showMenu(); }
function showWin() {
  if (state !== 'win') return;
  const r = result, total = coins.length;
  const old = store.get(bestKey(LV), null);
  const best = { stars: Math.max(r.stars, old ? old.stars : 0), score: Math.max(r.score, old ? old.score || 0 : 0), time: Math.min(r.time, old ? old.time : 1e9) };
  const isNew = old && (r.score > (old.score || 0));
  store.set(bestKey(LV), best);
  for (let i = 0; i < r.stars; i++) beep(660 + i * 220, 0.18, 'triangle', 0.1, 0, 0.25 + i * 0.32);
  const mark = ok => `<span class="${ok ? 'ok' : 'no'}">${ok ? '✔' : '✘'}</span>`;
  const next = LEVELS.indexOf(LV) + 1, hasNext = next < LEVELS.length;
  const again = ['再玩一次', () => start()], menu = ['选关', toMenu];
  show(`<h1>到达终点！</h1><h2>${lvTitle(LV)}</h2>${starsHtml(r.stars)}
    <p class="score">${fmt(r.score)}<span class="small"> 分</span></p>
    <p class="small">${isNew ? '<span class="new">新纪录！</span>' : old ? `最高 ${fmt(best.score)} 分` : ''}</p>
    <div class="stats"><div><b>${r.time.toFixed(1)}</b>用时(秒)</div><div><b>${raft.coins}/${total}</b>星星</div><div><b>×${raft.bestCombo}</b>最高连击</div></div>
    <div class="goals">${mark(true)} 抵达终点<br>${mark(r.gotCoins)} 收集 80% 以上的星星<br>${mark(r.clean)} 全程零碰撞</div>
    <p class="small">${r.fast ? `⚡ ${PAR_TIME} 秒内完成　` : ''}${hasNext ? (old ? '' : `已解锁${lvTitle(LEVELS[next])}`) : '你已通过全部关卡！'}</p>`,
    hasNext ? [[`下一关：${LEVELS[next].name}`, () => start(false, next)], again, menu] : [again, menu]);
}
function showDead() {
  if (state !== 'dead') return;
  const pct = Math.max(0, Math.round(raft.d / END * 100));
  const nearWhirl = whirls.some(v => Math.hypot(v.x - raft.x, v.d - raft.d) < 110);
  const tip = nearWhirl ? '离漩涡越近吸力越大：提前往另一侧靠，被吸住就冲刺甩脱。'
    : logs.some(l => Math.abs(l.d - raft.d) < 120) ? '漂木会来回漂动：按 ↓ 或松手减速，等它让开再冲过去。'
    : '星星标出的就是安全航线。<br>橡皮艇有惯性，看到礁石要提前转向！';
  show(`<h1>橡皮艇漏气了…</h1><h2>${lvTitle(LV)} · 已漂流 ${pct}%</h2>
    <p>${isTouch ? tip.replace('按 ↓ 或松手', '松手') : tip}</p>`, [['再试一次', () => start()], ['选关', toMenu]]);
}
function togglePause() {
  if (state === 'play') { state = 'pause'; show(`<h1>暂停</h1><p>休息一下，河水不会跑。</p>${isTouch ? '' : '<p class="small">按 <kbd>P</kbd> 继续　<kbd>R</kbd> 重新开始</p>'}`, [['继续', togglePause], ['重新开始', () => start()], ['选关', toMenu]]); }
  else if (state === 'pause') { state = 'play'; overlay.classList.add('hidden'); }
}

// ---------- 输入 ----------
const KEYS = { ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ArrowUp: 'U', w: 'U', W: 'U', ArrowDown: 'B', s: 'B', S: 'B', Shift: 'S' };
const pointers = new Map();
window.addEventListener('keydown', e => {
  if (KEYS[e.key]) { input[KEYS[e.key]] = true; e.preventDefault(); return; }
  if (e.repeat) return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  else if (e.key === 'm' || e.key === 'M') setMuted(!muted);
  else if (e.key === 'r' || e.key === 'R') { if (state !== 'menu') start(); }
  else if (e.key === 'Enter' || e.key === ' ') {
    const b = document.getElementById('go');
    if (b && !overlay.classList.contains('hidden')) b.click();
    else if (e.key === ' ') input.S = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { if (KEYS[e.key]) input[KEYS[e.key]] = false; if (e.key === ' ') input.S = false; });
function autoPause() { input.L = input.R = input.U = input.B = input.S = false; pointers.clear(); if (state === 'play') togglePause(); }
window.addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });

function syncPointers() {
  let L = false, R = false, S = false;
  for (const side of pointers.values()) { if (side < 0) L = true; else if (side > 0) R = true; else S = true; }
  input.L = L; input.R = R; input.S = S;
}
function logical(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
canvas.addEventListener('pointerdown', e => {
  audio();
  const [x, y] = logical(e);
  if (state === 'play' || state === 'ready') {
    if (Math.hypot(x - BTN.pause[0], y - BTN.pause[1]) < BTN.r + 6) { togglePause(); return; }
    if (Math.hypot(x - BTN.mute[0], y - BTN.mute[1]) < BTN.r + 6) { setMuted(!muted); return; }
  }
  const onSprint = isTouch && Math.hypot(x - W / 2, y - (H - 66)) < 44;
  pointers.set(e.pointerId, onSprint ? 0 : x < W / 2 ? -1 : 1); syncPointers(); e.preventDefault();
});
canvas.addEventListener('pointermove', e => { if (pointers.get(e.pointerId)) { pointers.set(e.pointerId, logical(e)[0] < W / 2 ? -1 : 1); syncPointers(); } });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, e => { if (pointers.delete(e.pointerId)) syncPointers(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- 主循环 ----------
const DT = 1 / 120;
let last = performance.now(), acc = 0, manual = false;
function frame(now) {
  if (!manual) {
    acc += Math.min(0.1, (now - last) / 1000);
    while (acc >= DT) { update(DT); acc -= DT; }
  }
  last = now;
  if (ambGain) {       // 环境声：离急流越近、船速越快，水声越大
    const active = state === 'play' || state === 'ready' || state === 'win';
    const rap = Math.max(boostAt(raft.d), boostAt(raft.d + 180) * 0.6, boostAt(raft.d + 360) * 0.3);
    const t = ac.currentTime, wob = 1 + Math.sin(now / 900) * 0.12 + Math.sin(now / 2300) * 0.1;
    ambGain.gain.setTargetAtTime((active ? 0.11 + 0.3 * rap : 0.05) * wob, t, 0.3);
    ambLp.frequency.setTargetAtTime(480 + 1300 * rap, t, 0.4);
    hissGain.gain.setTargetAtTime(active ? 0.012 + 0.07 * rap + Math.min(1, Math.hypot(raft.vx, raft.vd) / 260) * 0.012 : 0.006, t, 0.3);
    if (now > nextBird) { if (nextBird && active && rap < 0.2) sfx.bird(); nextBird = now + 2500 + Math.random() * 6000; }
  }
  draw();
  requestAnimationFrame(frame);
}

{ let lv = clamp(store.get('raft_level', 0) | 0, 0, LEVELS.length - 1); while (!unlocked(lv)) lv--; setLevel(lv); }
reset();
showMenu();
requestAnimationFrame(frame);

// 供自动化验收使用
window.__raft = {
  get state() { return state; }, get raft() { return raft; }, get result() { return result; },
  get level() { return { rocks, logs, coins, rings, ducks, whirls, END, id: LV.id }; },
  input, safeX, riverCx, riverW, start, draw,
  setManual(v) { manual = v; }, step() { update(DT); },
};
})();
</script>
</body>
