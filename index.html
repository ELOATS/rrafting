<style>

  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #e4dbc6; }
  body { box-sizing: border-box; -webkit-touch-callout: none;
         background: radial-gradient(ellipse at 50% 38%, #f0e9d8, #dad0b9);
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #loading, #rotate { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;

  body { display: flex; align-items: center; justify-content: center; font-family: var(--serif); color: var(--ink);

  /* 画布像一张裱好的画：宽屏上四周留一圈白边 */
  #wrap { position: relative; box-shadow: 0 10px 36px rgba(70,56,30,.26); }
  @media (min-width: 700px) { #wrap { box-shadow: 0 0 0 9px #fbf8ef, 0 0 0 10px rgba(59,53,45,.2), 0 18px 46px rgba(70,56,30,.3); } }
  canvas { display: block; }
  #overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center;

  /* 面板是一张纸卡：细墨线边框，里面再套一道淡线 */
  #panel { width: 82%; max-width: 344px; max-height: 94%; overflow-y: auto; box-sizing: border-box; padding: 26px 22px 20px; border-radius: 5px;
           background: radial-gradient(ellipse at 30% 0%, #fffdf6, var(--paper) 70%); border: 1px solid rgba(59,53,45,.32);
           outline: 1px solid rgba(59,53,45,.13); outline-offset: -7px; box-shadow: 0 14px 38px rgba(70,56,30,.3);
           animation: rise .3s ease-out; }
  @keyframes rise { from { transform: translateY(14px); opacity: 0; } }
  @keyframes pop { 0% { transform: scale(0) rotate(-50deg); } 70% { transform: scale(1.25) rotate(6deg); } 100% { transform: none; } }
  #panel h1 { margin: 0 0 6px; font: 600 33px/1.2 var(--kai); letter-spacing: 5px; text-indent: 5px; }

  #panel .off { filter: grayscale(1); opacity: .25; }
  #panel .lt { width: 15px; height: 15px; vertical-align: -3px; }
  #panel .score { margin: 0; font: 600 38px/1.15 var(--kai); color: var(--ochre); }
  #panel .stats { display: flex; justify-content: space-around; margin: 10px 0 8px; padding: 8px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

  #panel kbd { display: inline-block; min-width: 18px; padding: 0 6px; border-radius: 4px; background: #fffdf6; color: var(--ink);
               border: 1px solid rgba(59,53,45,.4); border-bottom-width: 2px; font: 600 12px/1.6 var(--serif); }

  button { margin-top: 14px; padding: 11px 22px; font: 600 19px/1 var(--kai); letter-spacing: 3px; text-indent: 3px; white-space: nowrap; color: #fbf7ea; cursor: pointer;
           background: linear-gradient(#7f9e68, #62824e); border: 1px solid #4f6b3f; border-radius: 7px;

  .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 9px; }

               background: rgba(255,253,246,.75); border: 1px solid rgba(59,53,45,.36); box-shadow: 0 1px 0 rgba(59,53,45,.22); }

        background: rgba(255,253,246,.55); border: 1px solid var(--line); border-left: 4px solid var(--c, #9ab58a); }
  .lv b { font: 600 17px/1.3 var(--kai); letter-spacing: 1px; } .lv span { font-size: 12px; color: var(--ink2); }
  .lv.sel { background: #fffdf6; border-color: rgba(59,53,45,.5); border-left-color: var(--c, #9ab58a); box-shadow: 0 4px 12px rgba(70,56,30,.16); }
  .lv.locked { cursor: default; opacity: .5; }

  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 9px 0; font-size: 14px; text-align: left; }
  .seg { display: flex; border-radius: 6px; overflow: hidden; border: 1px solid rgba(59,53,45,.4); flex-shrink: 0; background: rgba(255,253,246,.6); }
  button.opt { margin: 0; padding: 7px 11px; font: 500 13px/1 var(--serif); letter-spacing: 0; text-indent: 0; color: var(--ink2); background: transparent; border: 0; border-radius: 0; box-shadow: none; }
  button.opt + button.opt { border-left: 1px solid rgba(59,53,45,.3); }
  button.opt.on { color: #fbf7ea; background: var(--moss); font-weight: 700; }
  button.opt.warn { color: var(--verm); }
  button.opt:active { transform: none; box-shadow: none; }
</style>

<body>
<div id="loading">正在准备河道…</div>
<div id="rotate">请把手机竖过来玩</div>
<noscript><div style="position:fixed;top:40%;left:0;right:0;text-align:center;color:#3b352d">这个游戏需要启用 JavaScript 才能运行。</div></noscript>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="overlay" class="hidden"><div id="panel"></div></div>
</div>
<script>
function main() {
'use strict';
const VERSION = '2.0.0';

// 旧版浏览器（如 iOS 15）没有 roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
  let q = Array.isArray(r) ? (r.length >= 4 ? r : r.length === 2 ? [r[0], r[1], r[0], r[1]] : [r[0], r[0], r[0], r[0]]) : [r, r, r, r];
  const m = Math.min(w, h) / 2; q = q.map(v => Math.max(0, Math.min(v || 0, m)));
  this.moveTo(x + q[0], y); this.arcTo(x + w, y, x + w, y + h, q[1]); this.arcTo(x + w, y + h, x, y + h, q[2]);
  this.arcTo(x, y + h, x, y, q[3]); this.arcTo(x, y, x + w, y, q[0]); this.closePath();
};

// ---------- 基础 ----------
const W = 480;                 // 逻辑宽度
let H = 800;                   // 逻辑高度（随屏幕比例变化）
const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');
const wrap = document.getElementById('wrap');
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const FONT = '"Noto Serif SC", "Source Han Serif SC", "Songti SC", "STSong", "SimSun", "PingFang SC", serif';
const KAI = '"STKaiti", "KaiTi", "Kaiti SC", "LXGW WenKai", ' + FONT;       // 标题和画上的题字用楷体，找不到就退回宋体
const TAU = Math.PI * 2;

const chunks = new Map();     // 预渲染的地形分块
// 设置：音量、转向灵敏度、画质、震动
const cfg = { vol: 1, sens: 1, quality: 1, qLock: false, music: true, shake: !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) };
try { Object.assign(cfg, JSON.parse(localStorage.getItem('raft_settings')) || {}); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem('raft_settings', JSON.stringify(cfg)); } catch (e) {} };
const SENS = [{ rate: 0.72, a: 0.5 }, { rate: 1, a: 0.6 }, { rate: 1.35, a: 0.72 }];
function resize() {
  const cs = getComputedStyle(document.body), pad = k => parseFloat(cs['padding' + k]) || 0;       // 避开刘海和底部横条
  const mat = window.innerWidth >= 700 ? 24 : 0;                // 宽屏上给画四周的白边留出位置
  const ww = Math.max(120, window.innerWidth - pad('Left') - pad('Right') - mat), wh = Math.max(160, window.innerHeight - pad('Top') - pad('Bottom') - mat);
  H = Math.max(640, Math.min(1100, Math.round(W * wh / ww)));
  const scale = Math.min(ww / W, wh / H);
  // 渲染分辨率封顶：精细最多 2 倍逻辑分辨率，流畅不超过 1 倍，避免高分屏上白白多画像素
  const pr = cfg.quality ? Math.min(scale * (window.devicePixelRatio || 1), 2) : Math.min(scale, 1);
  wrap.style.width = canvas.style.width = W * scale + 'px';
  wrap.style.height = canvas.style.height = H * scale + 'px';
  canvas.width = Math.round(W * pr);
  canvas.height = Math.round(H * pr);
  ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
  chunks.clear();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();

function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
function hash(i, salt) {            // 稳定的装饰用伪随机 0..1
  let x = Math.imul(i | 0, 374761393) + Math.imul(salt | 0, 668265263);
  x = Math.imul(x ^ x >>> 13, 1274126177); return ((x ^ x >>> 16) >>> 0) / 4294967296;
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const store = {
  get(k, def) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
};

// ---------- 画材：纸、颜料与笔触 ----------
// 整个画面按水彩来画：颜色是薄薄地罩在纸上的，影子用冷紫灰而不是黑色，轮廓用断续的墨线勾。
const TS = 256;
const SUN = [6, 9];             // 影子偏移（阳光来自左上）
const PAPER = '#f4eddd', INK = '#3b352d';
const col = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const ink = a => `rgba(59,53,45,${a})`, paperA = a => `rgba(247,241,227,${a})`;
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
function makeFbm(p0, oct, seed) {            // 可平铺的分形噪声，输入 0..1
  const rnd = mulberry32(seed), grids = [];
  for (let o = 0; o < oct; o++) { const p = p0 << o, g = new Float32Array(p * p); for (let i = 0; i < g.length; i++) g[i] = rnd(); grids.push([p, g]); }
  return (u, v) => {
    let sum = 0, amp = 0.5, tot = 0;
    for (const [p, g] of grids) {
      const x = u * p, y = v * p, x0 = Math.floor(x), y0 = Math.floor(y);
      let fx = x - x0, fy = y - y0; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
      const a = x0 % p, b = (x0 + 1) % p, c = (y0 % p) * p, e = ((y0 + 1) % p) * p;
      sum += amp * lerp(lerp(g[c + a], g[c + b], fx), lerp(g[e + a], g[e + b], fx), fy);
      tot += amp; amp *= 0.5;
    }
    return sum / tot;
  };
}
function makeTex(fn, after) {
  const c = document.createElement('canvas'); c.width = c.height = TS;
  const g = c.getContext('2d'), img = g.createImageData(TS, TS), px = img.data;
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const v = fn(x / TS, y / TS), i = (y * TS + x) * 4;
    px[i] = v[0]; px[i + 1] = v[1]; px[i + 2] = v[2]; px[i + 3] = v[3] === undefined ? 255 : v[3];
  }
  g.putImageData(img, 0, 0);
  if (after) after(g);
  return c;
}
function wrapDraw(g, x, y, r, fn) {           // 跨边界的元素重复绘制以保证平铺
  for (const ox of [0, -TS, TS]) for (const oy of [0, -TS, TS]) {
    if (x + ox < -r || x + ox > TS + r || y + oy < -r || y + oy > TS + r) continue;
    fn(x + ox, y + oy);
  }
}
// 一团水彩：中间通透，靠近边缘颜料沉积略深，最外一圈晕开
function washBlob(g, x, y, r, c, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, col(c, a * 0.8)); gr.addColorStop(0.6, col(c, a * 0.86));
  gr.addColorStop(0.86, col([c[0] * 0.82, c[1] * 0.82, c[2] * 0.86], a)); gr.addColorStop(1, col(c, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
}
// 一笔：两头尖、中间宽，可以带一点弧度
function brush(g, x0, y0, x1, y1, w, bend = 0) {
  const mx = (x0 + x1) / 2, my = (y0 + y1) / 2, dx = x1 - x0, dy = y1 - y0, l = Math.hypot(dx, dy) || 1, nx = -dy / l, ny = dx / l;
  g.beginPath(); g.moveTo(x0, y0);
  g.quadraticCurveTo(mx + nx * (bend + w), my + ny * (bend + w), x1, y1);
  g.quadraticCurveTo(mx + nx * (bend - w), my + ny * (bend - w), x0, y0); g.fill();
}
const TEX = (() => {
  const f1 = makeFbm(4, 4, 11), f2 = makeFbm(32, 2, 12), f3 = makeFbm(6, 3, 13), f4 = makeFbm(9, 3, 14), rnd = mulberry32(99), blank = () => [0, 0, 0, 0];
  const paper = makeTex((u, v) => { const k = 238 + f1(u, v) * 12 + (f2(u, v) - 0.5) * 9; return [k, k - 3, k - 11]; }, g => {
    for (let i = 0; i < 420; i++) {           // 纸的纤维
      const x = rnd() * TS, y = rnd() * TS, a = rnd() * TAU, l = 3 + rnd() * 9;
      g.strokeStyle = rnd() < 0.6 ? 'rgba(120,100,70,.09)' : 'rgba(255,255,255,.35)'; g.lineWidth = 0.7;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
    }
  });
  const bloom = makeTex((u, v) => [255, 252, 244, smooth(0.5, 0.78, f3(u, v)) * 120]);          // 留白般的浅色晕
  const shade = makeTex((u, v) => [52, 70, 84, smooth(0.52, 0.8, f4(u, v)) * 62]);              // 颜料聚集的深色晕
  const grain = makeTex((u, v) => [70, 70, 80, Math.max(0, f2(u, v) - 0.6) * 150]);             // 颗粒沉淀
  const streak = makeTex(blank, g => {        // 水面上顺流的留白笔触
    g.fillStyle = '#fff';
    for (let i = 0; i < 64; i++) {
      const x = rnd() * TS, y = rnd() * TS, l = 12 + rnd() * rnd() * 70, w = 0.5 + rnd() * 1.1, b = (rnd() - 0.5) * 5;
      g.globalAlpha = 0.25 + rnd() * 0.6;
      wrapDraw(g, x, y, 90, (px, py) => brush(g, px, py, px + b, py + l, w, b * 0.4));
    }
    g.globalAlpha = 1;
  });
  const foam = makeTex((u, v) => [255, 255, 255, clamp((f1(u, v) * 0.55 + f4(v, u) * 0.45 + (f2(u, v) - 0.5) * 0.5 - 0.5) * 8, 0, 1) * 225], g => {    // 急流里的干笔飞白
    g.fillStyle = '#fff';
    for (let i = 0; i < 90; i++) {
      const x = rnd() * TS, y = rnd() * TS, l = 8 + rnd() * 30, b = (rnd() - 0.5) * 6, w = 0.8 + rnd() * 1.6;
      g.globalAlpha = 0.3 + rnd() * 0.6;
      wrapDraw(g, x, y, 50, (px, py) => brush(g, px, py, px + b, py + l, w));
    }
    g.globalAlpha = 1;
  });
  return { paper, bloom, shade, grain, streak, foam };
})();
const PAT = {};
for (const k in TEX) PAT[k] = ctx.createPattern(TEX[k], 'repeat');

// 预先画好的小画片：高分屏上用两倍分辨率，普通屏幕一倍就够，省得白白缩小
const SPR = (window.devicePixelRatio || 1) > 1.3 ? 2 : 1;
function sprite(size, paint) {
  const c = document.createElement('canvas'); c.width = c.height = size * SPR;
  const g = c.getContext('2d'); g.scale(SPR, SPR); g.translate(size / 2, size / 2); g.lineCap = g.lineJoin = 'round'; paint(g);
  return c;
}
// 树：从正上方看到的树冠，用几层透明的色块叠出来
const TREE = 112;
const TREES = (() => {
  const rnd = mulberry32(7);
  const leafy = (dark, mid, light, o = {}) => sprite(TREE, g => {
    if (o.branches) {                         // 花树：先画几根枝条，花开在枝上
      g.strokeStyle = 'rgba(84,58,46,.62)';
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * TAU + rnd(), l = 20 + rnd() * 12; g.lineWidth = 1.7;
        g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(Math.cos(a + 0.45) * l * 0.5, Math.sin(a + 0.45) * l * 0.5, Math.cos(a) * l, Math.sin(a) * l); g.stroke();

    const vt = -raft.vx * nd + raft.vd * nx;                 // 擦着石头滑过时的摩擦

  shakeDir[0] = nx; shakeDir[1] = -nd; squish(nx, nd, 1); buzz(45);

  ctx.fillStyle = g; oval(x, y, rx, ry, rot); ctx.fill();
  ctx.strokeStyle = ink(line); ctx.lineWidth = 0.9; ctx.stroke();
}

// 起点和终点：两根木桩之间拉一条绳，挂着草木染的小旗
const DYE = ['#5d7f9c', '#f1e7cf', '#c8705a', '#f1e7cf', '#d6a650', '#f1e7cf'];
function drawBanner(d, label) {
  const y = Y(d); if (y < -40 || y > H + 40) return;
  const xl = riverCx(d) - riverW(d) - 9, xr = riverCx(d) + riverW(d) + 9, n = 14, sag = 5;
  ctx.lineCap = 'round';
  ctx.strokeStyle = TH.shadow + '.2)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(xl + SUN[0], y + SUN[1]); ctx.quadraticCurveTo((xl + xr) / 2 + SUN[0], y + sag * 2 + SUN[1] + 4, xr + SUN[0], y + SUN[1]); ctx.stroke();
  for (let i = 0; i < n; i++) {
    const t = (i + 0.5) / n, x = lerp(xl, xr, t), yy = y + 4 * sag * t * (1 - t), w = (xr - xl) / n * 0.36, fl = Math.sin(T * 3.4 + i * 0.9) * 1.6;
    ctx.beginPath(); ctx.moveTo(x - w, yy); ctx.lineTo(x + w, yy); ctx.lineTo(x + fl, yy + 12); ctx.closePath();
    ctx.fillStyle = DYE[i % DYE.length]; ctx.fill(); ctx.strokeStyle = ink(0.32); ctx.lineWidth = 0.7; ctx.stroke();
  }
  ctx.strokeStyle = ink(0.7); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(xl, y); ctx.quadraticCurveTo((xl + xr) / 2, y + sag * 2, xr, y); ctx.stroke();
  for (const x of [xl, xr]) {
    ctx.fillStyle = TH.shadow + '.28)'; oval(x + SUN[0] * 0.7, y + SUN[1] * 0.7, 5, 4); ctx.fill();
    stone(x, y, 4.6, 4.6, 0, [[196, 160, 118], [140, 104, 72], [92, 66, 46]], 0.6);
  }
  inkText(label, (xl + xr) / 2, y - 17, 17, INK, 'center', KAI);
}

// 木桥：旧木板，深浅不一
function drawBridge(d) {
  const y = Y(d); if (y < -70 || y > H + 70) return;
  const xl = riverCx(d) - riverW(d) - 36, xr = riverCx(d) + riverW(d) + 36, h = 32;
  ctx.fillStyle = TH.shadow + '.26)'; ctx.fillRect(xl + SUN[0] * 1.8, y - h / 2 + SUN[1] * 1.8, xr - xl, h);
  for (let x = xl, i = 0; x < xr; x += 8.5, i++) {
    ctx.fillStyle = col(mixc([206, 184, 150], [156, 132, 106], hash(i, d | 0)));
    ctx.fillRect(x, y - h / 2 + (hash(i, 7) - 0.5) * 2.4, Math.min(8.6, xr - x), h);
  }
  const lg = ctx.createLinearGradient(0, y - h / 2, 0, y + h / 2);
  lg.addColorStop(0, 'rgba(255,248,226,.3)'); lg.addColorStop(0.5, 'rgba(255,248,226,0)'); lg.addColorStop(1, TH.shadow + '.2)');
  ctx.fillStyle = lg; ctx.fillRect(xl, y - h / 2 - 1, xr - xl, h + 2);
  ctx.strokeStyle = ink(0.26); ctx.lineWidth = 0.8; ctx.beginPath();
  for (let x = xl + 8.5, i = 0; x < xr; x += 8.5, i++) { ctx.moveTo(x, y - h / 2 + hash(i, 9) * 3); ctx.lineTo(x + (hash(i, 11) - 0.5), y + h / 2 - hash(i, 13) * 3); }
  ctx.stroke();
  for (const yy of [y - h / 2, y + h / 2]) {          // 栏杆和立柱
    ctx.fillStyle = TH.shadow + '.22)'; ctx.fillRect(xl, yy + 1, xr - xl, 4);
    ctx.fillStyle = '#8f7356'; ctx.fillRect(xl, yy - 3, xr - xl, 4.4); ctx.fillStyle = 'rgba(255,240,210,.35)'; ctx.fillRect(xl, yy - 3, xr - xl, 1.3);
    ctx.strokeStyle = ink(0.45); ctx.lineWidth = 0.8; ctx.strokeRect(xl, yy - 3, xr - xl, 4.4);
    for (const x of [xl, xl + (xr - xl) / 3, xl + (xr - xl) * 2 / 3, xr]) { ctx.fillStyle = '#6d543d'; ctx.fillRect(x - 3.6, yy - 5, 7.2, 8.4); ctx.strokeRect(x - 3.6, yy - 5, 7.2, 8.4); }
  }
}

// 礁石：水彩铺色，墨线勾形，迎水面一道飞白
function drawRock(r) {
  const y = Y(r.d), n = r.pts.length, P = TH.rock;
  const shape = (ox, oy, k) => {
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const a0 = i / n * TAU, a1 = (i + 0.5) / n * TAU, p0 = r.pts[i % n] * k, p1 = (r.pts[i % n] + r.pts[(i + 1) % n]) / 2 * k;
      const mx = r.x + ox + Math.cos(a1) * p1, my = y + oy + Math.sin(a1) * p1;
      if (i === 0) ctx.moveTo(mx, my); else ctx.quadraticCurveTo(r.x + ox + Math.cos(a0) * p0, y + oy + Math.sin(a0) * p0, mx, my);
    }
    ctx.closePath();
  };
  ctx.fillStyle = col(TH.deep, 0.2); shape(0, 0, 1.4); ctx.fill();                                // 水下隐约的石根
  ctx.fillStyle = TH.shadow + '.3)'; shape(SUN[0] * 0.8, SUN[1] * 0.8, 1.02); ctx.fill();        // 影子
  const pul = Math.sin(T * 5 + r.seed) * 1.1;                                                      // 迎水面的浪
  ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.ellipse(r.x, y + 2, r.r + 6, r.r + 8 + pul, 0, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.92)'; ctx.lineWidth = 3 + pul * 0.4; ctx.setLineDash([9 + r.r * 0.4, 2.5, 5, 2]); ctx.lineDashOffset = r.seed * 7;
  ctx.beginPath(); ctx.ellipse(r.x, y + 1, r.r + 2.5, r.r + 3.5 + pul, 0, 0.1 * Math.PI, 0.9 * Math.PI); ctx.stroke(); ctx.setLineDash([]);
  const g = ctx.createRadialGradient(r.x - r.r * 0.4, y - r.r * 0.45, r.r * 0.1, r.x, y, r.r * 1.15);
  g.addColorStop(0, col(P[0])); g.addColorStop(0.5, col(P[1])); g.addColorStop(1, col(P[2]));
  ctx.fillStyle = g; shape(0, 0, 1); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.fillStyle = col(P[2], 0.3); oval(r.x + r.r * 0.35, y + r.r * 0.45, r.r * 0.9, r.r * 0.6, 0.5); ctx.fill();      // 背光面再罩一层
  ctx.strokeStyle = ink(0.3); ctx.lineWidth = 0.9;                                                                       // 几道石纹
  for (let k = 0; k < 3; k++) {
    const a = hash(r.seed, 20 + k) * TAU, l = r.r * (0.5 + hash(r.seed, 30 + k) * 0.5);
    ctx.beginPath(); ctx.moveTo(r.x + Math.cos(a) * r.r * 0.15, y + Math.sin(a) * r.r * 0.15);
    ctx.quadraticCurveTo(r.x + Math.cos(a + 0.35) * l * 0.6, y + Math.sin(a + 0.35) * l * 0.6, r.x + Math.cos(a) * l, y + Math.sin(a) * l); ctx.stroke();
  }
  if (hash(r.seed, 77) > 0.45) washBlob(ctx, r.x + r.r * 0.3, y + r.r * 0.25, r.r * 0.5, [112, 150, 84], 0.6);        // 青苔
  washBlob(ctx, r.x - r.r * 0.35, y - r.r * 0.4, r.r * 0.45, [255, 252, 240], 0.4);
  ctx.restore();
  ctx.strokeStyle = ink(0.62); ctx.lineWidth = 1.2; ctx.setLineDash([16 + r.r, 2.5, 8, 2]); ctx.lineDashOffset = r.seed * 5; shape(0, 0, 1); ctx.stroke(); ctx.setLineDash([]);
}

// 漂木
function drawLog(l) {
  ctx.save(); ctx.translate(l.x, Y(l.d)); ctx.rotate(-l.rot); ctx.globalAlpha = l.fade;
  const x0 = -l.len - 6, x1 = l.len + 6, cr = Math.cos(l.rot), sr = Math.sin(l.rot), ox = (SUN[0] * cr - SUN[1] * sr) * 0.6, oy = (SUN[0] * sr + SUN[1] * cr) * 0.6;
  ctx.fillStyle = TH.shadow + '.3)'; ctx.beginPath(); ctx.roundRect(x0 + ox, -8 + oy, x1 - x0, 16, 8); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.roundRect(x0 - 3, -11 + Math.sin(T * 3 + l.seed) * 0.6, x1 - x0 + 6, 22, 11); ctx.stroke();
  const g = ctx.createLinearGradient(0, -8, 0, 8);
  g.addColorStop(0, '#b8946a'); g.addColorStop(0.35, '#c9a57a'); g.addColorStop(0.7, '#9a7652'); g.addColorStop(1, '#6e5038');
  ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(x0, -8, x1 - x0, 16, 7); ctx.fill();
  ctx.strokeStyle = ink(0.6); ctx.lineWidth = 1.1; ctx.stroke();
  ctx.strokeStyle = ink(0.3); ctx.lineWidth = 0.8; ctx.lineCap = 'round';                        // 木纹
  for (let k = 0; k < 5; k++) {
    const yy = -5 + k * 2.5, a = x0 + 6 + hash(k, l.seed) * 14, b = x1 - 10 - hash(k, 3 + l.seed) * 14;
    ctx.beginPath(); ctx.moveTo(a, yy); ctx.quadraticCurveTo((a + b) / 2, yy + (hash(k, 9) - 0.5) * 2.4, b, yy); ctx.stroke();
  }
  ctx.fillStyle = '#8a6a4a'; ctx.beginPath(); ctx.roundRect(-9, -12.5, 5, 6, 2); ctx.fill(); ctx.strokeStyle = ink(0.5); ctx.stroke();      // 断枝
  ctx.fillStyle = '#e6cfa4'; oval(x1 - 1.5, 0, 3, 6.8); ctx.fill(); ctx.strokeStyle = ink(0.5); ctx.lineWidth = 0.9; ctx.stroke();           // 截面年轮
  ctx.strokeStyle = 'rgba(140,100,64,.7)'; oval(x1 - 1.5, 0, 1.6, 4); ctx.stroke();
  ctx.globalAlpha = 1; ctx.restore();
}

const VEST = ['#46708e', '#d9a441', '#46708e', '#d9a441'], HELM = ['#f6f0e0', '#ecc96e', '#9cc0d2', '#f6f0e0'];
function drawRaft() {
  const x = raft.x, y = Y(raft.d), b = body;
  const ghost = raft.inv > 0 && state === 'play' ? 0.72 + 0.28 * Math.cos(raft.inv * 30) : 1;      // 无敌时间内半透明地闪，而不是整个消失
  const z = Math.max(-2, b.z);
  ctx.save(); ctx.translate(x, y);
  // 水面上的影子：艇被浪抛起时，影子会离开艇身
  ctx.save(); ctx.translate(SUN[0] * (0.7 + z * 0.13), SUN[1] * (0.7 + z * 0.13)); ctx.rotate(raft.a);
  ctx.globalAlpha = clamp(1 - z * 0.03, 0.5, 1) * (1 - raft.sink * 0.7) * ghost;
  ctx.fillStyle = TH.shadow + '.34)'; ctx.beginPath(); ctx.roundRect(-14, -24, 28, 48, [13, 13, 10, 10]); ctx.fill(); ctx.restore();
  ctx.rotate(raft.a);
  // 艇首推开的水
  const bow = clamp(raft.rel / 150, 0, 1) * (z < 5 ? 1 : 0);
  if (bow > 0.08 && !raft.sink) {
    ctx.strokeStyle = `rgba(255,255,255,${0.85 * bow})`; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 3, -26); ctx.quadraticCurveTo(s * 15, -23, s * (18 + bow * 8), -8 + bow * 10); ctx.stroke(); }
    ctx.fillStyle = `rgba(255,255,255,${0.55 * bow})`; oval(0, -25.5, 9, 3); ctx.fill();
  }
  // 浮沉（整体放大）→ 弹性形变（沿撞击方向压扁再回弹）→ 俯仰（纵向缩短）
  const sc = (1 - raft.sink * 0.5) * (1 + z * 0.007), jel = clamp(b.jel, -0.6, 1);
  ctx.scale(sc, sc * (1 - Math.abs(b.pitch) * 0.05)); ctx.globalAlpha = (1 - raft.sink * 0.7) * ghost;
  ctx.rotate(b.jang); ctx.scale(1 - jel * 0.2, 1 + jel * 0.13); ctx.rotate(-b.jang);
  const tilt = b.roll * 5, dip = b.pitch * 4;                // 侧倾和俯仰时，艇内的东西相对气囊偏移
  const cx = tilt + b.lx, cy = dip + b.ly;                    // 队员还带着自己的惯性

  // 桨（在队员之下）：木柄，浅色桨叶
  const seats = [[-1, -9, raft.phL, raft.dirL], [-1, 5, raft.phL, raft.dirL], [1, -9, raft.phR, raft.dirR], [1, 5, raft.phR, raft.dirR]];
  const blade = (ph, dir) => ph <= 0 ? [-1, false] : ph < POWER ? [lerp(-8, 8, ph / POWER) * dir, true] : [lerp(8, -8, (ph - POWER) / (1 - POWER)) * dir, false];
  for (const [s, sy, ph, dir] of seats) {
    const [by, wet] = blade(ph, dir), bx = s * (wet ? 24 : 22), yy = sy + by;
    ctx.strokeStyle = '#7d5c3c'; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s * 6 + cx, sy + by * 0.25 - 1 + cy); ctx.lineTo(bx, yy); ctx.stroke();
    if (wet) { ctx.fillStyle = 'rgba(255,255,255,.7)'; oval(bx + s * 2, yy + 1, 5.5, 3.5); ctx.fill(); }
    ctx.fillStyle = wet ? '#c9b488' : '#efe0b8';
    ctx.save(); ctx.translate(bx + s * 3, yy); ctx.rotate(s * by * 0.03); ctx.beginPath(); ctx.roundRect(-4.5, wet ? -1.6 : -2.6, 9, wet ? 3.2 : 5.2, 1.5); ctx.fill();
    ctx.strokeStyle = ink(0.45); ctx.lineWidth = 0.6; ctx.stroke(); ctx.restore();
  }
  // 气囊：珊瑚红，横向的明暗做出圆筒的体积；侧倾时高光跟着移动
  const hull = k => { ctx.beginPath(); ctx.roundRect(-14 + k, -24 + k, 28 - 2 * k, 48 - 2 * k, [13 - k * 0.8, 13 - k * 0.8, Math.max(2, 10 - k), Math.max(2, 10 - k)]); };
  const tg = ctx.createLinearGradient(-14 - tilt * 0.9, 0, 14 - tilt * 0.9, 0);
  tg.addColorStop(0, '#a8442f'); tg.addColorStop(0.12, '#dc6548'); tg.addColorStop(0.2, '#f6a585'); tg.addColorStop(0.3, '#e46f51');
  tg.addColorStop(0.7, '#e46f51'); tg.addColorStop(0.78, '#f09474'); tg.addColorStop(0.9, '#cf583d'); tg.addColorStop(1, '#93382a');
  ctx.fillStyle = tg; hull(0); ctx.fill();
  if (raft.hp < 3) { ctx.fillStyle = `rgba(70,50,60,${0.13 * (3 - raft.hp)})`; hull(0); ctx.fill(); }      // 漏气后气囊发瘪发暗
  const eg = ctx.createLinearGradient(0, -24 - dip * 1.5, 0, 24 - dip * 1.5);          // 首尾两端的明暗，俯仰时前后移动
  eg.addColorStop(0, 'rgba(255,236,206,.45)'); eg.addColorStop(0.14, 'rgba(255,236,206,0)'); eg.addColorStop(0.86, 'rgba(70,40,70,0)'); eg.addColorStop(1, 'rgba(70,40,70,.38)');
  ctx.fillStyle = eg; hull(0); ctx.fill();
  ctx.save(); hull(5.6); ctx.clip(); ctx.translate(tilt * 0.5, dip * 0.5);              // 艇底：被气囊内缘裁切
  ctx.fillStyle = '#5f6f76'; ctx.fillRect(-12, -22, 24, 44);
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 0.7; ctx.beginPath();
  for (let i = -17.5; i <= 17.5; i += 3.5) { ctx.moveTo(-9, i); ctx.lineTo(9, i); } ctx.stroke();
  for (const ty of [-2, 11]) {                                                           // 横隔气囊
    const cg = ctx.createLinearGradient(0, ty - 2.6, 0, ty + 2.6);
    cg.addColorStop(0, '#f6a585'); cg.addColorStop(0.5, '#e46f51'); cg.addColorStop(1, '#a8442f');
    ctx.fillStyle = cg; ctx.fillRect(-10, ty - 2.6, 20, 5.2);
  }
  ctx.restore();
  ctx.strokeStyle = ink(0.5); ctx.lineWidth = 1; hull(6.2); ctx.stroke();
  ctx.setLineDash([3, 2.2]); ctx.strokeStyle = 'rgba(255,250,236,.85)'; ctx.lineWidth = 0.8; hull(1.6); ctx.stroke(); ctx.setLineDash([]);   // 安全绳
  ctx.strokeStyle = ink(0.68); ctx.lineWidth = 1.1; hull(0); ctx.stroke();               // 墨线勾出艇形
  // 四名队员：救生衣 + 头盔，随划桨前后俯仰，加减速和转弯时身体会晃
  seats.forEach(([s, sy, ph, dir], i) => {
    const [by] = blade(ph, dir), lean = by * 0.14, px = s * 9 + cx, py = sy + cy;
    ctx.strokeStyle = '#56646e'; ctx.lineWidth = 2; ctx.lineCap = 'round';               // 手臂
    ctx.beginPath(); ctx.moveTo(px - s * 0.5, py - 1.5); ctx.lineTo(s * 12.5 + cx * 0.5, sy + by * 0.5); ctx.moveTo(px - s * 1.5, py + 1.5); ctx.lineTo(s * 8 + cx, sy + by * 0.3 + cy); ctx.stroke();
    ctx.fillStyle = TH.shadow + '.3)'; oval(px + 1, py + 1.6, 4.6, 3.8); ctx.fill();
    ctx.fillStyle = VEST[i]; oval(px, py + lean * 0.4, 4.4, 3.6); ctx.fill(); ctx.strokeStyle = ink(0.45); ctx.lineWidth = 0.6; ctx.stroke();
    const hx = px + b.lx * 0.6, hy = py - 0.6 + lean + b.ly * 0.6;                        // 头比身体晃得更厉害
    ctx.fillStyle = HELM[i]; circle(hx, hy, 2.9); ctx.fill(); ctx.strokeStyle = ink(0.55); ctx.lineWidth = 0.7; ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.75)'; circle(hx - 0.9, hy - 0.9, 0.9); ctx.fill();
  });
  ctx.restore();
}

function drawDuck(k) {
  const y = Y(k.d), fl = k.fly;
  if (fl > 1.2) return;
  ctx.save(); ctx.translate(k.x, y - fl * 20);
  ctx.globalAlpha = clamp(1.2 - fl, 0, 1);
  const sc = 1 + fl * 0.5; ctx.scale(sc * (k.s < 0 && fl ? -1 : 1), sc);
  if (!fl) {
    ctx.fillStyle = TH.shadow + '.26)'; oval(3, 4, 7, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; ctx.lineCap = 'round';      // 身后的两道水痕
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(-6, s * 3); ctx.quadraticCurveTo(-12, s * 6, -17 - Math.sin(T * 3 + k.ph) * 2, s * 9); ctx.stroke(); }
  } else {
    const wg = Math.sin(T * 30) * 5;
    ctx.fillStyle = k.brown ? '#b08a64' : '#fbf8f0'; ctx.strokeStyle = ink(0.4); ctx.lineWidth = 0.7;
    oval(0, -5 - wg * 0.4, 4, 7, 0.3); ctx.fill(); ctx.stroke(); oval(0, 5 + wg * 0.4, 4, 7, -0.3); ctx.fill(); ctx.stroke();
  }
  const g = ctx.createRadialGradient(-2, -2, 1, 0, 0, 8);
  if (k.brown) { g.addColorStop(0, '#c2a07a'); g.addColorStop(1, '#7c5c40'); } else { g.addColorStop(0, '#ffffff'); g.addColorStop(1, '#d8d6cc'); }
  ctx.fillStyle = g; oval(0, 0, 7, 4.8); ctx.fill(); ctx.strokeStyle = ink(0.5); ctx.lineWidth = 0.8; ctx.stroke();
  ctx.fillStyle = k.brown ? '#3f7a52' : '#fbf8f0'; circle(6, -1.8, 3.1); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e09a3c'; ctx.beginPath(); ctx.moveTo(8.3, -3.2); ctx.lineTo(12.5, -1.8); ctx.lineTo(8.3, -0.4); ctx.fill();
  ctx.fillStyle = INK; circle(6.8, -2.6, 0.7); ctx.fill();
  ctx.restore();
}

// 岸上的树木：位置由哈希决定，树影与树冠分两遍画
function eachTree(d0, d1, fn) {
  for (let i = Math.floor(d0 / 30) - 2; i <= d1 / 30 + 2; i++) for (const s of [-1, 1]) {
    if (hash(i, 80 + s) < TH.treeSkip) continue;
    const d = i * 30 + hash(i, 50 + s) * 26;
    if (BRIDGES.some(b => Math.abs(b - d) < 46) || Math.abs(d) < 34 || Math.abs(d - END) < 34) continue;
    const k = 0.5 + hash(i, 70 + s) * 0.62, edge = riverCx(d) + s * (riverW(d) + 8 + 36 * k), room = s < 0 ? edge + 20 : W + 20 - edge; if (room < 4) continue;
    const t = hash(i, 60 + s), x = edge + s * t * t * room;
    fn(x, d, k, TH.kinds[hash(i, 90 + s) * TH.kinds.length | 0], hash(i, 95 + s) * TAU, i);
  }
}
const drawTree = (v) => ctx.drawImage(TREES[v], -TREE / 2, -TREE / 2, TREE, TREE);

// 静态的风景按 512 一段预先画好并缓存：下层（纸、草地、沙岸、水色、树影）和上层（树冠）
const CH = 512;
function drawTerrain(d0, d1) {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, CH + 2); ctx.clip();
  ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, CH + 2);
  ctx.fillStyle = col(TH.ground, 0.86); ctx.fillRect(0, 0, W, CH + 2);
  // 大片的晕染：深一点的、暖一点的、留白的，互相渗在一起
  for (let i = Math.floor(d0 / 70) - 2; i <= d1 / 70 + 2; i++) for (let k = 0; k < 2; k++) {
    const h = hash(i, 1 + k), x = hash(i, 3 + k) * W, y = Y(i * 70 + hash(i, 5 + k) * 70), r = 46 + hash(i, 7 + k) * 70;

  ctx.strokeStyle = ink(0.4); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(bx, by0); ctx.lineTo(bx, by1); ctx.stroke();
  ctx.strokeStyle = TEAL; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.moveTo(bx, by1); ctx.lineTo(bx, py); ctx.stroke();
  ctx.fillStyle = '#e46f51'; oval(bx, py, 5, 8); ctx.fill(); ctx.strokeStyle = ink(0.7); ctx.lineWidth = 1; ctx.stroke();
  inkText('终', bx, by0 - 14, 12, INK, 'center', KAI);
  if (state === 'play' && raft.hole > 0.15) inkText('回流！全力划出去', W / 2, 86, 17 + Math.sin(T * 14) * 1.2, VERMILION, 'center', KAI, 700);
  else if (boostAt(raft.d) > 0.5 && state === 'play') inkText('急　流', W / 2, 86, 17, TEAL, 'center', KAI, 700);
  if (toast && toast.t > 0) { ctx.globalAlpha = Math.min(1, toast.t); paperTag(toast.text, W / 2, 116, 12); ctx.globalAlpha = 1; }
  // 触屏按钮：三枚淡淡的纸钮
  if (isTouch && (state === 'play' || state === 'ready')) {
    const sx = W / 2, sy = H - 66, ease = Math.min(1, fdt * 18);              // 按下、松开都有一小段过渡
    hud.L += ((input.L ? 1 : 0) - hud.L) * ease; hud.R += ((input.R ? 1 : 0) - hud.R) * ease; hud.S += ((input.S && !raft.tired ? 1 : 0) - hud.S) * ease;
    ctx.fillStyle = paperA(0.3 + 0.4 * hud.S); circle(sx, sy, 36 + hud.S * 3); ctx.fill(); ctx.strokeStyle = ink(0.3); ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = raft.tired ? VERMILION : MOSS; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(sx, sy, 36 + hud.S * 3, -Math.PI / 2, -Math.PI / 2 + TAU * raft.stam); ctx.stroke();
    ctx.strokeStyle = ink(0.75); ctx.lineWidth = 3; ctx.lineJoin = 'round';
    for (const oy of [-9, 3]) { ctx.beginPath(); ctx.moveTo(sx - 12, sy + oy + 8); ctx.lineTo(sx, sy + oy - 4); ctx.lineTo(sx + 12, sy + oy + 8); ctx.stroke(); }
    for (const [s, on] of [[-1, hud.L], [1, hud.R]]) {
      const x = W / 2 + s * (W / 2 - 62), y = H - 70;
      ctx.fillStyle = paperA(0.3 + 0.4 * on); circle(x, y, 42 + on * 3); ctx.fill(); ctx.strokeStyle = ink(0.3); ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = ink(0.75); ctx.beginPath(); ctx.moveTo(x + s * 17, y); ctx.lineTo(x - s * 9, y - 16); ctx.lineTo(x - s * 9, y + 16); ctx.closePath(); ctx.fill();
    }
  }
}

// ---------- 界面 ----------
function show(html, buttons) {
  panel.innerHTML = html + '<div class="btns">' + buttons.map(([label], i) => `<button ${i ? 'class="alt"' : 'id="go"'} data-i="${i}">${label}</button>`).join('') + '</div>';
  panel.style.animation = 'none'; void panel.offsetWidth; panel.style.animation = '';
  overlay.classList.remove('hidden');
  panel.querySelectorAll('button[data-i]').forEach(b => { b.onclick = e => { e.stopPropagation(); buttons[b.dataset.i][1](); }; });
}
// 评价用莲花表示：最多三朵
const starsHtml = n => `<div class="stars">${[0, 1, 2].map(i => `<img class="${i < n ? 'on' : 'off'}" style="--i:${i}" src="${LOTUS_URL}" alt="">`).join('')}</div>`;
const lotusRow = n => [0, 1, 2].map(i => `<img class="lt${i < n ? '' : ' off'}" src="${LOTUS_URL}" alt="">`).join('');
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, ',');

// 通关上一关才解锁下一关
const unlocked = i => i <= 0 || !!store.get(bestKey(LEVELS[i - 1]), null);
function showMenu() {
  state = 'menu';
  const cards = LEVELS.map((lv, i) => {
    const b = store.get(bestKey(lv), null);
    if (!unlocked(i)) return `<div class="lv locked" style="--c:${THEMES[lv.theme].accent}"><b><i class="lock"></i>${lvTitle(lv)}</b><span>通关「${LEVELS[i - 1].name}」后解锁</span></div>`;
    return `<div class="lv${lv === LV ? ' sel' : ''}" data-lv="${i}" style="--c:${THEMES[lv.theme].accent}"><b>${lvTitle(lv)}</b><span>${b ? `${lotusRow(b.stars)} · ${fmt(b.score || 0)} 分 · ${b.time.toFixed(1)} 秒` : lv.intro}</span></div>`;
  }).join('');
  const total = LEVELS.reduce((n, lv) => n + ((store.get(bestKey(lv), null) || {}).stars || 0), 0);
  show(`<h1>橡皮艇漂流</h1><h2>选择关卡 <img class="lt" src="${LOTUS_URL}" alt=""> ${total}/${LEVELS.length * 3}</h2>${cards}
    <p class="small">${isTouch ? '按住屏幕<b>左侧 / 右侧</b>转向　两侧同时按住前进<br><b>中间按钮</b>冲刺'
      : '<kbd>←</kbd> <kbd>→</kbd> 转向　<kbd>↑</kbd> 前进　<kbd>↓</kbd> 倒划<br><kbd>空格</kbd> 冲刺　<kbd>P</kbd> 暂停　<kbd>M</kbd> 静音　<kbd>R</kbd> 重开'}</p>
    <p class="small">橡皮艇只经得起 3 次碰撞。</p>`, [['出发', () => start()], ['设置', () => showSettings(showMenu)]]);
  panel.querySelectorAll('.lv[data-lv]').forEach(el => { el.onclick = e => { e.stopPropagation(); pickLevel(+el.dataset.lv); }; });
}
function pickLevel(i) {
  if (i < 0 || i >= LEVELS.length || !unlocked(i)) return;
  if (LEVELS[i] !== LV) { setLevel(i); store.set('raft_level', i); reset(); }
  showMenu();
}
function start(skipCountdown, level) {
  audio(); if (level !== undefined && LEVELS[level] !== LV) { setLevel(level); store.set('raft_level', level); }
  reset(); overlay.classList.add('hidden');
  if (skipCountdown) { state = 'play'; raft.vd = 60; } else { state = 'ready'; countdown = 2.1; sfx.tick(); }
}
function toMenu() { reset(); showMenu(); }
function showSettings(back) {
  const seg = (key, opts, cur) => `<div class="seg">${opts.map(([label, v]) => `<button class="opt${v === cur ? ' on' : ''}" data-k="${key}" data-v="${v}">${label}</button>`).join('')}</div>`;
  const row = (label, body) => `<div class="row"><span>${label}</span>${body}</div>`;
  show(`<h1>设置</h1><h2>更改立即生效并自动保存</h2>
    ${row('音量', seg('vol', [['静音', 0], ['低', 0.35], ['中', 0.7], ['高', 1]], muted ? 0 : cfg.vol))}
    ${row('转向灵敏度', seg('sens', [['低', 0], ['中', 1], ['高', 2]], cfg.sens))}
    ${row('画质', seg('quality', [['流畅', 0], ['精细', 1]], cfg.quality))}
    ${row('背景音乐', seg('music', [['关', 0], ['开', 1]], cfg.music ? 1 : 0))}
    ${row('撞击震动', seg('shake', [['关', 0], ['开', 1]], cfg.shake ? 1 : 0))}
    ${document.fullscreenEnabled ? row('全屏', seg('fs', [['关', 0], ['开', 1]], document.fullscreenElement ? 1 : 0)) : ''}
    ${row('游戏进度', '<div class="seg"><button class="opt warn" id="wipe">重置进度</button></div>')}
    <p class="small">转向灵敏度越高，艇头转得越快、角度越大。<br>手机上卡顿时把画质调到"流畅"。</p>
    <p class="small" style="opacity:.6">橡皮艇漂流 v${VERSION}</p>`, [['返回', back]]);
  panel.querySelectorAll('.opt[data-k]').forEach(b => { b.onclick = e => {
    e.stopPropagation(); audio(); const k = b.dataset.k, v = +b.dataset.v;
    if (k === 'vol') { if (v > 0) cfg.vol = v; setMuted(v === 0); if (v > 0) beep(880, 0.12, 'triangle', 0.1); }
    else if (k === 'shake') cfg.shake = !!v;
    else if (k === 'music') cfg.music = !!v;
    else if (k === 'fs') { const done = () => showSettings(back); (v ? document.documentElement.requestFullscreen() : document.exitFullscreen()).then(done, done); return; }
    else if (k === 'quality') { cfg.quality = v; cfg.qLock = true; }
    else cfg[k] = v;
    saveCfg(); if (k === 'quality') resize();
    showSettings(back);
  }; });
  const wipe = document.getElementById('wipe');
  wipe.onclick = e => {
    e.stopPropagation();
    if (!wipe.dataset.sure) { wipe.dataset.sure = 1; wipe.textContent = '再点一次确认'; return; }
    for (const lv of LEVELS) { try { localStorage.removeItem(bestKey(lv)); } catch (err) {} }
    store.set('raft_level', 0);
    if (state === 'pause') { showSettings(back); document.getElementById('wipe').textContent = '已重置'; }
    else { setLevel(0); reset(); state = 'menu'; showSettings(showMenu); document.getElementById('wipe').textContent = '已重置'; }
  };
}
function showWin() {
  if (state !== 'win') return;
  const r = result, total = coins.length;
  const old = r.old, best = r.best;
  const isNew = old && (r.score > (old.score || 0));
  for (let i = 0; i < r.stars; i++) chime(note(659.25, [0, 4, 7][i]), 0.09, 0.25 + i * 0.32, 0.7);
  const mark = ok => `<span class="${ok ? 'ok' : 'no'}">${ok ? '✔' : '✘'}</span>`;
  const next = LEVELS.indexOf(LV) + 1, hasNext = next < LEVELS.length;
  const again = ['再玩一次', () => start()], menu = ['选关', toMenu], sh = ['分享成绩', share];
  show(`<h1>到达终点</h1><h2>${lvTitle(LV)}</h2>${starsHtml(r.stars)}
    <p class="score">${fmt(r.score)}<span class="small"> 分</span></p>
    <p class="small">${isNew ? '<span class="new">新纪录！</span>' : old ? `最高 ${fmt(best.score)} 分` : ''}</p>
    <div class="stats"><div><b>${r.time.toFixed(1)}</b>用时(秒)</div><div><b>${raft.coins}/${total}</b>莲花</div><div><b>×${raft.bestCombo}</b>最高连击</div></div>
    <div class="goals">${mark(true)} 抵达终点<br>${mark(r.gotCoins)} 采到 80% 以上的莲花<br>${mark(r.clean)} 全程零碰撞</div>
    <p class="small">${r.fast ? `${PAR_TIME} 秒内完成 · ` : ''}${hasNext ? (old ? '' : `已解锁${lvTitle(LEVELS[next])}`) : '你已通过全部关卡！'}</p>`,
    hasNext ? [[`下一关：${LEVELS[next].name}`, () => start(false, next)], again, menu, sh] : [again, menu, sh]);
}
function share() {
  const r = result, url = /^https?:$/.test(location.protocol) ? location.href : '';
  const text = `我在《橡皮艇漂流》${lvTitle(LV)}得到 ${r.stars} 朵莲花的评价，${fmt(r.score)} 分，用时 ${r.time.toFixed(1)} 秒！`;
  const say = msg => { const b = [...panel.querySelectorAll('button')].find(x => /分享|复制/.test(x.textContent)); if (b) b.textContent = msg; };
  if (navigator.share) navigator.share(url ? { title: '橡皮艇漂流', text, url } : { title: '橡皮艇漂流', text }).catch(() => {});
  else if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url ? text + ' ' + url : text).then(() => say('已复制到剪贴板'), () => say('复制失败'));
  else say('这个浏览器不支持分享');
}
function showDead() {
  if (state !== 'dead') return;
  const pct = Math.max(0, Math.round(raft.d / END * 100));
  const nearWhirl = whirls.some(v => Math.hypot(v.x - raft.x, v.d - raft.d) < 110);
  const tip = drops.some(q => Math.abs(q.d - raft.d) < 150) ? '跌水两侧的白水是回流：对准中间光滑的水舌冲下去，被卷住就冲刺划出去。'
    : nearWhirl ? '离漩涡越近吸力越大：提前往另一侧靠，被吸住就冲刺甩脱。'
    : logs.some(l => l.on && Math.hypot(l.x - raft.x, l.d - raft.d) < 120) ? '漂木跟着水流走：别从后面硬撞，看准空当从旁边超过去。'
    : '莲花开着的地方就是安全航线。<br>橡皮艇有惯性，看到礁石要提前转向。';
  show(`<h1>橡皮艇漏气了…</h1><h2>${lvTitle(LV)} · 已漂流 ${pct}%</h2>
    <p>${isTouch ? tip.replace('按 ↓ 或松手', '松手') : tip}</p>`, [['再试一次', () => start()], ['选关', toMenu]]);
}
function showPause() {
  show(`<h1>暂停</h1><p>休息一下，河水不会跑。</p><p class="small">${isTouch ? '按住左侧 / 右侧转向　两侧同时按住前进<br>中间按钮冲刺'
    : '<kbd>←</kbd> <kbd>→</kbd> 转向　<kbd>↑</kbd> 前进　<kbd>↓</kbd> 倒划　<kbd>空格</kbd> 冲刺<br>按 <kbd>P</kbd> 继续　<kbd>R</kbd> 重新开始'}</p>`,
    [['继续', togglePause], ['重新开始', () => start()], ['设置', () => showSettings(showPause)], ['选关', toMenu]]);
}
function togglePause() {
  if (state === 'play') { state = 'pause'; showPause(); }
  else if (state === 'pause') { state = 'play'; overlay.classList.add('hidden'); }
}

// ---------- 输入 ----------
const KEYS = { ArrowLeft: 'L', a: 'L', A: 'L', ArrowRight: 'R', d: 'R', D: 'R', ArrowUp: 'U', w: 'U', W: 'U', ArrowDown: 'B', s: 'B', S: 'B', Shift: 'S' };
const pointers = new Map();
window.addEventListener('keydown', e => {
  if (state === 'menu' && panel.querySelector('.lv')) {          // 选关界面：↑ ↓ 或数字键换关
    const cur = LEVELS.indexOf(LV), to = e.key === 'ArrowDown' ? cur + 1 : e.key === 'ArrowUp' ? cur - 1 : /^[1-9]$/.test(e.key) ? +e.key - 1 : -1;
    if (to >= 0) { e.preventDefault(); pickLevel(to); return; }
  }
  if (KEYS[e.key]) { input[KEYS[e.key]] = true; e.preventDefault(); return; }
  if (e.repeat) return;
  if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  else if (e.key === 'm' || e.key === 'M') setMuted(!muted);
  else if (e.key === 'r' || e.key === 'R') { if (state !== 'menu') start(); }
  else if (e.key === 'Enter' || e.key === ' ') {
    const b = document.getElementById('go');
    if (b && !overlay.classList.contains('hidden')) b.click();
    else if (e.key === ' ') input.S = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => { if (KEYS[e.key]) input[KEYS[e.key]] = false; if (e.key === ' ') input.S = false; });
function autoPause() { input.L = input.R = input.U = input.B = input.S = false; pointers.clear(); if (state === 'play') togglePause(); }
window.addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => {       // 切到后台：暂停并彻底静音
  if (document.hidden) { autoPause(); if (ac && ac.state === 'running') ac.suspend(); }
  else if (ac && ac.state === 'suspended') ac.resume();
});
const rotateMq = window.matchMedia ? matchMedia('(orientation: landscape) and (max-height: 480px) and (pointer: coarse)') : null;
window.addEventListener('resize', () => { if (rotateMq && rotateMq.matches) autoPause(); });

function syncPointers() {
  let L = false, R = false, S = false;
  for (const side of pointers.values()) { if (side < 0) L = true; else if (side > 0) R = true; else S = true; }
  input.L = L; input.R = R; input.S = S;
}
function logical(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * W, (e.clientY - r.top) / r.height * H]; }
canvas.addEventListener('pointerdown', e => {
  audio();
  const [x, y] = logical(e);
  if (state === 'play' || state === 'ready') {
    if (Math.hypot(x - BTN.pause[0], y - BTN.pause[1]) < BTN.r + 6) { togglePause(); return; }
    if (Math.hypot(x - BTN.mute[0], y - BTN.mute[1]) < BTN.r + 6) { setMuted(!muted); return; }
  }
  const onSprint = isTouch && Math.hypot(x - W / 2, y - (H - 66)) < 44;
  pointers.set(e.pointerId, onSprint ? 0 : x < W / 2 ? -1 : 1); syncPointers(); e.preventDefault();
});
canvas.addEventListener('pointermove', e => { if (pointers.get(e.pointerId)) { pointers.set(e.pointerId, logical(e)[0] < W / 2 ? -1 : 1); syncPointers(); } });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, e => { if (pointers.delete(e.pointerId)) syncPointers(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// ---------- 主循环 ----------
const DT = 1 / 120;
let last = performance.now(), acc = 0, manual = false, hitStop = 0, slowT = 0, toast = null, endT = 0;
let frameErrors = 0, halted = false, tscale = 1;
function frame(now) {
  if (halted) return;
  requestAnimationFrame(frame);
  try { tick(now); frameErrors = 0; }
  catch (e) {
    if (frameErrors++ === 0) console.error(e);
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    if (frameErrors > 40) {        // 连续出错：停下来，给玩家一个能恢复的出口
      halted = true; state = 'menu';
      show('<h1>出了点问题</h1><p>游戏遇到了意外错误。<br>你的进度已经保存，刷新页面即可继续。</p>', [['刷新页面', () => location.reload()]]);
    }
  }
}
function tick(now) {
  const real = Math.min(0.1, (now - last) / 1000);
  last = now; fdt = real;
  if (toast) toast.t -= real;
  endT = state === 'win' || state === 'dead' ? endT + real : 0;
  if (!manual) {
    if (hitStop > 0) hitStop -= real;                                   // 撞击瞬间的顿帧
    else { tscale += ((endT > 0 && endT < 0.9 ? 0.4 : 1) - tscale) * Math.min(1, real * 9); acc += real * tscale; }      // 冲线和沉没时渐入渐出的慢动作
    while (acc >= DT) { update(DT); acc -= DT; }
    // 连续掉帧时自动降到流畅画质（手动选过画质就不再干预）
    if (state === 'play' && cfg.quality && !cfg.qLock) {
      slowT = real > 0.03 ? slowT + real : Math.max(0, slowT - real * 0.5);
      if (slowT > 2.5) { cfg.quality = 0; saveCfg(); resize(); slowT = 0; toast = { text: '画面有些卡，已切换到流畅画质（可在设置里改回）', t: 5 }; }
    }
  }
  music();
  if (ambGain) {       // 环境声：离急流越近、船速越快，水声越大
    const active = state === 'play' || state === 'ready' || state === 'win';
    let rap = Math.max(boostAt(raft.d), boostAt(raft.d + 180) * 0.6, boostAt(raft.d + 360) * 0.3);
    for (const q of drops) rap = Math.max(rap, 0.85 * (1 - Math.abs(q.d - raft.d - 60) / 380));      // 跌水的轰鸣
    const t = ac.currentTime, wob = 1 + Math.sin(now / 900) * 0.12 + Math.sin(now / 2300) * 0.1;
    ambGain.gain.setTargetAtTime((state === 'pause' ? 0 : active ? 0.11 + 0.3 * rap : 0.05) * wob, t, 0.3);
    ambLp.frequency.setTargetAtTime(480 + 1300 * rap, t, 0.4);
    hissGain.gain.setTargetAtTime(state === 'pause' ? 0 : active ? 0.012 + 0.07 * rap + Math.min(1, Math.hypot(raft.vx, raft.vd) / 260) * 0.012 : 0.006, t, 0.3);
    if (now > nextBird) { if (nextBird && active && rap < 0.2) sfx.bird(); nextBird = now + 2500 + Math.random() * 6000; }
  }
  draw();
}

{ let lv = clamp(store.get('raft_level', 0) | 0, 0, LEVELS.length - 1); while (!unlocked(lv)) lv--; setLevel(lv); }
reset();
showMenu();
requestAnimationFrame(frame);

// 供自动化验收使用
window.__raft = {
  get state() { return state; }, get raft() { return raft; }, get result() { return result; },
  get level() { return { rocks, logs, coins, rings, ducks, whirls, drops, END, id: LV.id }; }, get cfg() { return cfg; },
  input, safeX, riverCx, riverW, start, draw,
  setManual(v) { manual = v; }, step() { update(DT); },
};
}
// 先让“正在准备”显示出来，再开始生成贴图
requestAnimationFrame(() => setTimeout(() => {
  const tip = document.getElementById('loading');
  try { main(); tip.remove(); }
  catch (e) { tip.textContent = '游戏加载失败。请刷新页面，或换一个较新的浏览器试试。'; console.error(e); }
}, 0));
// 通过 https 访问时启用离线缓存
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
